version: '3'
services:
  connector-import-document-ai:
    image: opencti/connector-import-document-ai:latest
    environment:
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe
      - CONNECTOR_NAME=ImportDocumentAI
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true # Validate any bundle before import
      - CONNECTOR_SCOPE=application/pdf,text/plain,text/html,text/markdown
      - CONNECTOR_AUTO=false # Enable/disable auto-import of file
      - CONNECTOR_LOG_LEVEL=error
      # - CONNECTOR_XTM_ONE_INTENT=cti.stix_harvester # XTM One intent for agent-based extraction
      # - IMPORT_DOCUMENT_AI_INCLUDE_RELATIONSHIPS=true # Include relationships extracted from the document
      # - IMPORT_DOCUMENT_AI_CREATE_INDICATOR=false # Flag extracted observables for indicator creation
      # - IMPORT_DOCUMENT_AI_API_BASE_URL=ChangeMe # Base URL of the Import Document AI web service (legacy direct mode)
      # - IMPORT_DOCUMENT_AI_API_KEY=ChangeMe # PEM licence/certificate key for the web service (legacy direct mode)
    restart: always
