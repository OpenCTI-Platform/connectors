comment:
    layout: "diff, files, condensed_footer"
    hide_project_coverage: true # set to true
    require_changes: "coverage_drop AND uncovered_patch"

ignore:
  # Ignore any folder whose name starts with "test" anywhere in the tree
  - "**/test*/**"
  # CI and tooling scripts are not covered by tests. Without this, a PR that
  # only touches them makes `codecov empty-upload` fail with "Testable files
  # changed" and blocks the required codecov/patch check.
  - ".github/**"
  - ".mise/**"
coverage:
  status:
    project:
      default:
        target: auto
        informational: true
    patch:
      default:
        target: 80%
        informational: false