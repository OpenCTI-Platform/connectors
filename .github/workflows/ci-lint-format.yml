name: Lint & Format

on:
  pull_request:
  merge_group:
    branches:
      - master
      - lts/**
    types: [checks_requested]
  workflow_call:

env:
  UV_SYSTEM_PYTHON: 1
  

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Native git diff (no third-party action): on pull_request, only run the
      # heavy jobs below when relevant connector code changed. Any other event
      # (merge_group, workflow_call) always runs the full checks.
      - name: Check if relevant paths changed
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(connectors-sdk|external-import|internal-enrichment|internal-export-file|internal-import-file|stream)/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  ensure_formatting:
    name: Ensure Formatting
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Create virtual environment
        run: uv venv

      - name: Install formatting tools
        run: uv pip install -r ci-requirements.txt

      - name: Check isort
        run: uv run isort --profile black --line-length 88 --check-only --diff .

      - name: Check black
        run: uv run black --check --diff .

  base_linter:
    name: Base Linter (flake8)
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # - run: sudo apt-get update -qq && sudo apt-get install -y curl gettext

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install flake8
        run: uv pip install flake8

      - name: Run flake8
        run: uv run flake8 --ignore=E,W .

  linter:
    name: STIX ID Linter
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # - run: sudo apt-get update -qq && sudo apt-get install -y curl gettext
      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Install pylint plugin dependencies
        run: uv pip install -r ./shared/pylint_plugins/check_stix_plugin/requirements.txt

      - name: Run STIX ID pylint
        run: |
          cd ./shared/pylint_plugins/check_stix_plugin && \
            PYTHONPATH=. pylint ../../../ \
            --disable=all \
            --enable=no_generated_id_stix,no-value-for-parameter,unused-import \
            --load-plugins linter_stix_id_generator