name: Lint & Format

on:
  pull_request:
  merge_group:
    branches:
      - master
      - lts/**
    types: [checks_requested]
  workflow_call:

env:
  UV_SYSTEM_PYTHON: 1
  

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # On pull_request, sets relevant=false when no connector code changed, so the
  # jobs below are skipped (a skipped job still satisfies a required check).
  # Any other event leaves the output empty and runs everything.
  detect-changes:
    name: Detect relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check if relevant paths changed
        id: filter
        run: |
          # HEAD is the PR test merge commit, so HEAD^1 is the base branch.
          # Captured first so a git failure fails the step instead of being
          # hidden by a pipe.
          changed_files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if grep -qE '^(connectors-sdk|external-import|internal-enrichment|internal-export-file|internal-import-file|stream)/' <<< "$changed_files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # The jobs below fail open: they run unless detect-changes positively found
  # nothing relevant, so a failed or skipped detection never skips a check.
  ensure_formatting:
    name: Ensure Formatting
    needs: detect-changes
    if: ${{ !cancelled() && needs.detect-changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Create virtual environment
        run: uv venv

      - name: Install formatting tools
        run: uv pip install -r ci-requirements.txt

      - name: Check isort
        run: uv run isort --profile black --line-length 88 --check-only --diff .

      - name: Check black
        run: uv run black --check --diff .

  base_linter:
    name: Base Linter (flake8)
    needs: detect-changes
    if: ${{ !cancelled() && needs.detect-changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # - run: sudo apt-get update -qq && sudo apt-get install -y curl gettext

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install flake8
        run: uv pip install flake8

      - name: Run flake8
        run: uv run flake8 --ignore=E,W .

  linter:
    name: STIX ID Linter
    needs: detect-changes
    if: ${{ !cancelled() && needs.detect-changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # - run: sudo apt-get update -qq && sudo apt-get install -y curl gettext
      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Install pylint plugin dependencies
        run: uv pip install -r ./shared/pylint_plugins/check_stix_plugin/requirements.txt

      - name: Run STIX ID pylint
        run: |
          cd ./shared/pylint_plugins/check_stix_plugin && \
            PYTHONPATH=. pylint ../../../ \
            --disable=all \
            --enable=no_generated_id_stix,no-value-for-parameter,unused-import \
            --load-plugins linter_stix_id_generator