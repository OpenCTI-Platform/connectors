name: Build Connector Images

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode (rolling, prerelease, release)"
        required: true
        default: "rolling"
        type: choice
        options:
          - rolling
          - prerelease
          - release
      push:
        description: "Push images to registries"
        required: true
        default: "true"
        type: boolean
  push:
    branches:
      - master
      - 'release/*'
      - 'lts/*'
    tags:
      # Global version tags only (e.g. 7.260529.0 , 7.260529.0-lts.0).
      # Per-connector tags (mitre/v2.3.1) and SDK tags (connectors-sdk/v*)
      # do NOT match these patterns because glob '*' excludes '/'.
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-lts*'

# No workflow-wide concurrency group here on purpose. GitHub Actions
# concurrency operates on the whole run, not per-job — a top-level group
# would gate lint/tests/build-manifest AND the image builds together. With
# cancel-in-progress: false, several commits pushed in a short interval used
# to pile up pending runs of which GitHub only keeps the latest, silently
# dropping the connectors changed by the discarded runs (each run's
# build_alpine_matrix.py only diffs its own HEAD~1..HEAD).
#
# Instead:
#   - lint (ci-lint-format.yml), tests (ci-tests-connectors.yml) and
#     build-manifest.yml each declare their own concurrency (cancel-in-progress:
#     true, keyed off the ref), so calling them from multiple overlapping
#     runs of this workflow still dedupes that work correctly.
#   - Image builds are deliberately NOT deduped at the run level: concurrency
#     for those is scoped per connector directory in build-connector-type.yml,
#     so unrelated connectors always build in full across overlapping runs,
#     while repeated pushes touching the same connector still cancel/dedupe
#     safely.

permissions:
  contents: read

jobs:
  # Determine build mode from the git ref
  resolve-build-mode:
    name: Resolve build mode
    runs-on: ubuntu-latest
    outputs:
      build_mode: ${{ steps.mode.outputs.build_mode }}
    steps:
      - name: Determine build mode
        id: mode
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "build_mode=release" >> "$GITHUB_OUTPUT"
            echo "🏷️ Build mode: release (tag: ${{ github.ref_name }})"
          elif [ "${{ github.ref_name }}" = "master" ]; then
            echo "build_mode=rolling" >> "$GITHUB_OUTPUT"
            echo "🔄 Build mode: rolling (master)"
          else
            echo "build_mode=prerelease" >> "$GITHUB_OUTPUT"
            echo "📦 Build mode: prerelease (branch: ${{ github.ref_name }})"
          fi

  lint:
    uses: ./.github/workflows/ci-lint-format.yml
    permissions:
      contents: read

  tests:
    uses: ./.github/workflows/ci-tests-connectors.yml
    permissions:
      contents: read
    secrets: inherit

  build-manifest:
    needs: [resolve-build-mode, lint, tests]
    uses: ./.github/workflows/build-manifest.yml
    permissions:
      contents: write
      actions: read
    secrets: inherit

  build-alpine:
    needs: [resolve-build-mode, lint, tests]
    uses: ./.github/workflows/build-alpine.yml
    permissions:
      contents: read
      packages: write
    with:
      build_mode: ${{ needs.resolve-build-mode.outputs.build_mode }}
      push: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_UBI9 }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASS_UBI9 }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  build-ubi9:
    needs: [resolve-build-mode, lint, tests]
    uses: ./.github/workflows/build-ubi9.yml
    permissions:
      contents: read
      packages: write
    with:
      build_mode: ${{ needs.resolve-build-mode.outputs.build_mode }}
      push: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_UBI9 }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASS_UBI9 }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
