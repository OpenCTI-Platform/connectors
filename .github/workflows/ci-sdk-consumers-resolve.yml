name: SDK consumers resolve

# A dependency pin changed in connectors-sdk must still resolve for every connector that installs the SDK, including
# the connectors the pull request does not touch (their images are only rebuilt on master).

on:
  pull_request:
    paths:
      - 'connectors-sdk/pyproject.toml'
      - '.github/scripts/resolve_sdk_consumers.py'
      - '.github/workflows/ci-sdk-consumers-resolve.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve every connector that depends on connectors-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Resolve the consumers with the SDK of this pull request
        # requirements.txt and pyproject.toml consumers, each resolved for the Python version its Dockerfile runs
        run: python3 .github/scripts/resolve_sdk_consumers.py --jobs 8
