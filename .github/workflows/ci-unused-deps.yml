name: Dependency Check (deptry)

on:
  pull_request:
    paths:
      - 'external-import/**'
      - 'internal-enrichment/**'
      - 'internal-export-file/**'
      - 'internal-import-file/**'
      - 'stream/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  discover:
    name: Discover changed connectors
    runs-on: ubuntu-latest
    outputs:
      connectors: ${{ steps.set.outputs.connectors }}
      has_changes: ${{ steps.set.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the list of changed connectors
        id: set
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_files=$(gh pr diff "$PR_NUMBER" --name-only)
          conns=()
          for dir in external-import internal-enrichment internal-import-file internal-export-file stream; do
            for connector in "$dir"/*/; do
              connector="${connector%/}"
              # A connector is scannable if it declares dependencies via a
              # requirements.txt or a pyproject.toml (root or src/).
              [ -f "$connector/src/requirements.txt" ] \
                || [ -f "$connector/requirements.txt" ] \
                || [ -f "$connector/pyproject.toml" ] \
                || [ -f "$connector/src/pyproject.toml" ] \
                || continue
              echo "$pr_files" | grep -q "^${connector}/" && conns+=("$connector")
            done
          done

          if [ "${#conns[@]}" -eq 0 ]; then
            echo "connectors=[]" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s\n' "${conns[@]}" \
              | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({path: ., name: gsub("/"; "_")})')
            echo "connectors=$json" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  deptry:
    name: Scan ${{ matrix.conn.path }}
    needs: discover
    if: needs.discover.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        conn: ${{ fromJson(needs.discover.outputs.connectors) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run deptry
        id: scan
        env:
          DEPTRY_RESULTS_DIR: ${{ runner.temp }}/deptry-results
        run: |
          set +e
          python3 .github/scripts/deptry_scan.py "${{ matrix.conn.path }}"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deptry-${{ matrix.conn.name }}
          path: ${{ runner.temp }}/deptry-results
          if-no-files-found: ignore
          retention-days: 1

      - name: Enforce result
        if: always()
        run: exit ${{ steps.scan.outputs.rc }}

  report:
    name: Report dependency findings
    needs: [discover, deptry]
    if: always() && needs.discover.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Download findings
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: deptry-results
          pattern: deptry-*
          merge-multiple: true

      - name: Aggregate findings
        id: agg
        run: |
          mkdir -p deptry-results
          errors=""
          warnings=""
          shopt -s nullglob
          for f in deptry-results/*.err; do errors="${errors}$(cat "$f")"$'\n'; done
          for f in deptry-results/*.warn; do warnings="${warnings}$(cat "$f")"$'\n'; done

          {
            echo "errors<<DEPTRY_EOF"
            [ -n "$errors" ] && printf '%s' "$errors"
            echo "DEPTRY_EOF"
            echo "warnings<<DEPTRY_EOF"
            [ -n "$warnings" ] && printf '%s' "$warnings"
            echo "DEPTRY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: steps.agg.outputs.warnings != '' || steps.agg.outputs.errors != ''
        uses: actions/github-script@v7
        env:
          WARNINGS: ${{ steps.agg.outputs.warnings }}
          ERRORS: ${{ steps.agg.outputs.errors }}
        with:
          script: |
            const marker = '<!-- unused-deps-bot -->';
            const errors = process.env.ERRORS.trim();
            const warnings = process.env.WARNINGS.trim();
            let body = `${marker}`;
            if (errors) {
              body += `\n❌ **Undeclared dependencies detected (blocking)**\n\nThe following packages are imported but not declared (\`DEP001\`):\n\n${errors}\n> **How to fix:** add the missing package to the connector's \`requirements.txt\`. If the import name differs from the PyPI package name, add a mapping line to \`.github/deptry-package-map.txt\`.`;
            }
            if (warnings) {
              body += `\n\n⚠️ **Dependency warnings**\n\nThe following packages are unused (\`DEP002\`) or only available transitively (\`DEP003\`):\n\n${warnings}\n> **How to fix:** (1) if the package is used but under a different import name (e.g. \`PyYAML\` → \`yaml\`), add a mapping line to \`.github/deptry-package-map.txt\`. (2) if truly unused, remove it from the connector's \`requirements.txt\`. (3) if transitive, declare it explicitly in \`requirements.txt\`.`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Remove comment if no findings
        if: steps.agg.outputs.warnings == '' && steps.agg.outputs.errors == ''
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- unused-deps-bot -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }

