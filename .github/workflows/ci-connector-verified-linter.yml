name: Connector Verified Linter

on:
  # No paths filter on pull_request, so the workflow always reports. The
  # matrix scripts already select only the connectors changed by the PR.
  pull_request:
  merge_group:
    branches:
      - master
      - lts/**
    types: [checks_requested]
  workflow_call:

concurrency:
  group: connector-verified-linter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-connectors:
    name: Detect eligible connectors
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_connectors: ${{ steps.set-matrix.outputs.has_connectors }}
      connector_count: ${{ steps.set-matrix.outputs.connector_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve RELEASE_REF
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            PR_BASE_REF="${{ github.event.merge_group.base_ref }}"
          else
            PR_BASE_REF="${{ github.base_ref }}"
          fi
          PR_BASE_REF="${PR_BASE_REF#refs/heads/}"

          if [ -n "${PR_BASE_REF:-}" ]; then
            case "${PR_BASE_REF}" in
              master|release/6.9.x|lts/*)
                RESOLVED_RELEASE_REF="${PR_BASE_REF}"
                echo "Using PR base branch for RELEASE_REF: ${RESOLVED_RELEASE_REF}"
                ;;
              *)
                RESOLVED_RELEASE_REF="$(bash ./shared/tools/ci/detect-base-branch.sh origin)"
                echo "PR base '${PR_BASE_REF}' is outside allowed refs, using fallback RELEASE_REF: ${RESOLVED_RELEASE_REF}"
                ;;
            esac
          else
            RESOLVED_RELEASE_REF="$(bash ./shared/tools/ci/detect-base-branch.sh origin)"
            echo "Using detected fallback RELEASE_REF: ${RESOLVED_RELEASE_REF}"
          fi
          echo "RELEASE_REF=${RESOLVED_RELEASE_REF}" >> "$GITHUB_ENV"

      - id: set-matrix
        name: Build linter matrix from connector manifests
        run: python .github/scripts/build_linter_matrix.py

  detect-new-connectors:
    name: Detect newly added connectors
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_connectors: ${{ steps.set-matrix.outputs.has_connectors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve RELEASE_REF
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            PR_BASE_REF="${{ github.event.merge_group.base_ref }}"
          else
            PR_BASE_REF="${{ github.base_ref }}"
          fi
          PR_BASE_REF="${PR_BASE_REF#refs/heads/}"

          if [ -n "${PR_BASE_REF:-}" ]; then
            case "${PR_BASE_REF}" in
              master|release/6.9.x|lts/*)
                RESOLVED_RELEASE_REF="${PR_BASE_REF}"
                echo "Using PR base branch for RELEASE_REF: ${RESOLVED_RELEASE_REF}"
                ;;
              *)
                RESOLVED_RELEASE_REF="$(bash ./shared/tools/ci/detect-base-branch.sh origin)"
                echo "PR base '${PR_BASE_REF}' is outside allowed refs, using fallback RELEASE_REF: ${RESOLVED_RELEASE_REF}"
                ;;
            esac
          else
            RESOLVED_RELEASE_REF="$(bash ./shared/tools/ci/detect-base-branch.sh origin)"
            echo "Using detected fallback RELEASE_REF: ${RESOLVED_RELEASE_REF}"
          fi
          echo "RELEASE_REF=${RESOLVED_RELEASE_REF}" >> "$GITHUB_ENV"

      - id: set-matrix
        name: Build new-connector matrix
        run: python .github/scripts/build_new_connector_matrix.py

  vclint:
    name: Lint ${{ matrix.name }}
    needs:
      - detect-connectors
    if: needs.detect-connectors.outputs.has_connectors == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-connectors.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Create virtual environment
        run: uv venv

      - name: Install connector-linter
        run: uv pip install ./shared/tools/connector_linter

      # Findings are surfaced as annotations and in the PR comment (see
      # vclint-comment), but this step never fails the check: connector
      # errors stay visible without turning the PR red. VC105/VC305 on new
      # connectors (see vclint-new-connector-settings below) remain blocking.
      - name: Run connector-linter
        run: |
          set -o pipefail
          : > annotations.txt
          while IFS= read -r connector_path; do
            [ -z "$connector_path" ] && continue
            echo "::group::Linting ${connector_path}"
            uv run connector-linter check "$connector_path" --format github | tee -a annotations.txt || true
            uv run connector-linter check "$connector_path" --format markdown --verbose >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done <<< "${{ matrix.connector_paths }}"
          exit 0

      - name: Upload linter annotations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vclint-annotations-${{ strategy.job-index }}
          path: annotations.txt
          if-no-files-found: ignore
          retention-days: 1

  # Aggregates ::error annotations from every vclint matrix job (verified and
  # manager-supported alike) and posts/updates a single PR comment listing
  # each error's code, message, and a permalink to the offending line. Kept
  # separate from the blocking pass/fail logic above so manager-supported
  # connectors' errors stay visible even though they don't fail the check.
  # Above MAX_COMMENTED_CONNECTORS linted connectors (bulk changes such as a
  # dependency bump), no comment is posted: the error list would exceed the
  # environment and comment size limits. Annotations and step summaries of
  # the vclint jobs still report every error.
  vclint-comment:
    name: Comment connector-linter errors on PR
    needs:
      - detect-connectors
      - vclint
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-connectors.outputs.has_connectors == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download linter annotations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: vclint-annotations-*
          path: annotations

      - name: Build error list
        id: build-errors
        env:
          CONNECTOR_COUNT: ${{ needs.detect-connectors.outputs.connector_count }}
          MAX_COMMENTED_CONNECTORS: 20
        run: |
          errors=""
          count=0
          repo="${{ github.repository }}"
          sha="${{ github.event.pull_request.head.sha }}"

          if [ "${CONNECTOR_COUNT:-0}" -gt "$MAX_COMMENTED_CONNECTORS" ]; then
            echo "::notice::${CONNECTOR_COUNT} connectors linted (more than ${MAX_COMMENTED_CONNECTORS}): no PR comment, see the vclint job annotations and summaries."
          elif [ -d annotations ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              file=$(echo "$line" | sed -E 's/^::error file=([^,]+),line=([0-9]+)::.*/\1/')
              lineno=$(echo "$line" | sed -E 's/^::error file=([^,]+),line=([0-9]+)::.*/\2/')
              rest=$(echo "$line" | sed -E 's/^::error file=[^,]+,line=[0-9]+:://')
              code=$(echo "$rest" | cut -d: -f1)
              msg=$(echo "$rest" | cut -d: -f2- | sed -E 's/^ //')
              url="https://github.com/${repo}/blob/${sha}/${file}#L${lineno}"
              errors="${errors}- **${code}**: ${msg} ([${file}:${lineno}](${url}))\n"
              count=$((count + 1))
            done < <(grep -h '^::error ' annotations/*/annotations.txt 2>/dev/null || true)
          fi

          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "errors<<EOF"
            echo -e "$errors"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: steps.build-errors.outputs.count != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const marker = '<!-- connector-linter-bot -->';
            const body = `${marker}\n🔴 **Connector Linter errors detected**\n\n${process.env.ERRORS}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        env:
          ERRORS: ${{ steps.build-errors.outputs.errors }}

      - name: Remove comment if no errors
        if: steps.build-errors.outputs.count == '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const marker = '<!-- connector-linter-bot -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }

  # Newly-added connectors are not yet "verified" or "manager_supported", so
  # they are skipped by the `vclint` job above (which only targets eligible
  # connectors and is blocking only for the "verified-with-date" subset). This
  # job enforces VC105 (no absolute date) and VC305 (connectors-sdk
  # BaseConnectorSettings) as hard, blocking requirements for any connector
  # introduced for the first time in this PR, so new code never lands with
  # absolute dates in config/scheduling or the legacy get_config_variable() pattern.
  vclint-new-connector-settings:
    name: VC305 (new connector) ${{ matrix.name }}
    needs:
      - detect-new-connectors
    if: needs.detect-new-connectors.outputs.has_connectors == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-new-connectors.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Create virtual environment
        run: uv venv

      - name: Install connector-linter
        run: uv pip install ./shared/tools/connector_linter

      - name: Run VC105/VC305 (connectors-sdk settings) on new connectors
        run: |
          exit_code=0
          while IFS= read -r connector_path; do
            [ -z "$connector_path" ] && continue
            echo "::group::Checking VC105/VC305 for ${connector_path}"
            uv run connector-linter check "$connector_path" --select VC105 --select VC305 --format github || exit_code=$?
            echo "::endgroup::"
          done <<< "${{ matrix.connector_paths }}"
          exit "$exit_code"

  # Single, stable job name to set as a required status check. Matrix entries
  # can't be required (their names change with the matrix content) and both
  # matrices are skipped when there is nothing to lint, so this job always runs
  # and gives one go/no-go. Same pattern as Tests Summary.
  linter-summary:
    name: Connector Linter Summary
    needs:
      - detect-connectors
      - detect-new-connectors
      - vclint
      - vclint-new-connector-settings
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        env:
          DETECT_RESULT: ${{ needs.detect-connectors.result }}
          HAS_CONNECTORS: ${{ needs.detect-connectors.outputs.has_connectors }}
          VCLINT_RESULT: ${{ needs.vclint.result }}
          DETECT_NEW_RESULT: ${{ needs.detect-new-connectors.result }}
          HAS_NEW_CONNECTORS: ${{ needs.detect-new-connectors.outputs.has_connectors }}
          VCLINT_NEW_RESULT: ${{ needs.vclint-new-connector-settings.result }}
        run: |
          fail=0
          # A matrix may only be skipped when its detector succeeded and found
          # nothing to lint. A failed detection leaves has_connectors empty.
          check() {
            local label="$1" detect="$2" has="$3" matrix="$4"
            if [ "$detect" != "success" ]; then
              echo "::error::${label}: detection did not succeed (result: ${detect})."
              fail=1
            elif [ "$has" = "true" ] && [ "$matrix" != "success" ]; then
              echo "::error::${label}: matrix did not succeed (result: ${matrix})."
              fail=1
            fi
          }
          check "Lint" "$DETECT_RESULT" "$HAS_CONNECTORS" "$VCLINT_RESULT"
          check "VC305 (new connector)" "$DETECT_NEW_RESULT" "$HAS_NEW_CONNECTORS" "$VCLINT_NEW_RESULT"
          [ "$fail" -eq 0 ] && echo "Connector linter checks passed."
          exit "$fail"
