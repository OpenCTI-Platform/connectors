name: Tests Connectors

on:
  pull_request:
  merge_group:
    branches:
      - master
      - lts/**
    types: [checks_requested]
  workflow_call:

permissions:
  contents: read

jobs:
  detect-test-files:
    name: Detect test files
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_tests: ${{ steps.set-matrix.outputs.has_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # needed for git merge-base in build_test_matrix.py

      # build_test_matrix.py runs every connector for any change outside the
      # connector directories, so on pull_request a PR touching only docs or
      # unrelated CI is cut off here and no matrix is built. Changes to the test
      # infrastructure itself still run it. Other events always build it.
      - name: Check if relevant paths changed
        id: filter
        if: github.event_name == 'pull_request'
        run: |
          relevant='^(connectors-sdk|external-import|internal-enrichment|internal-export-file|internal-import-file|stream|shared|templates)/'
          relevant+='|^(run_test\.sh|\.github/workflows/ci-tests-connectors\.yml|\.github/scripts/(build_test_matrix|_matrix_common)\.py)$'
          # HEAD is the PR test merge commit, so HEAD^1 is the base branch.
          # Captured first so a git failure fails the step instead of being
          # hidden by a pipe. quotePath=false keeps non-ASCII paths unquoted.
          changed_files=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD)
          if grep -qE "$relevant" <<< "$changed_files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve RELEASE_REF
        if: steps.filter.outputs.relevant != 'false'
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            PR_BASE_REF="${{ github.event.merge_group.base_ref }}"
          else
            PR_BASE_REF="${{ github.base_ref }}"
          fi
          PR_BASE_REF="${PR_BASE_REF#refs/heads/}"

          if [ -n "${PR_BASE_REF:-}" ]; then
            case "${PR_BASE_REF}" in
              master|release/6.9.x|lts/*)
                RESOLVED_RELEASE_REF="${PR_BASE_REF}"
                echo "Using PR base branch for RELEASE_REF: ${RESOLVED_RELEASE_REF}"
                ;;
              *)
                RESOLVED_RELEASE_REF="$(bash ./shared/tools/ci/detect-base-branch.sh origin)"
                echo "PR base '${PR_BASE_REF}' is outside allowed refs, using fallback RELEASE_REF: ${RESOLVED_RELEASE_REF}"
                ;;
            esac
          else
            RESOLVED_RELEASE_REF="$(bash ./shared/tools/ci/detect-base-branch.sh origin)"
            echo "Using detected fallback RELEASE_REF: ${RESOLVED_RELEASE_REF}"
          fi
          echo "RELEASE_REF=${RESOLVED_RELEASE_REF}" >> "$GITHUB_ENV"

      - id: set-matrix
        name: Build test matrix from test-requirements.txt files
        if: steps.filter.outputs.relevant != 'false'
        run: python .github/scripts/build_test_matrix.py

  test:
    name: Test ${{ matrix.name }}
    needs:
      - detect-test-files
    if: needs.detect-test-files.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-test-files.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve RELEASE_REF
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            PR_BASE_REF="${{ github.event.merge_group.base_ref }}"
          else
            PR_BASE_REF="${{ github.base_ref }}"
          fi
          PR_BASE_REF="${PR_BASE_REF#refs/heads/}"

          if [ -n "${PR_BASE_REF:-}" ]; then
            case "${PR_BASE_REF}" in
              master|release/6.9.x|lts/*)
                RESOLVED_RELEASE_REF="${PR_BASE_REF}"
                echo "Using PR base branch for RELEASE_REF: ${RESOLVED_RELEASE_REF}"
                ;;
              *)
                RESOLVED_RELEASE_REF="$(bash ./shared/tools/ci/detect-base-branch.sh origin)"
                echo "PR base '${PR_BASE_REF}' is outside allowed refs, using fallback RELEASE_REF: ${RESOLVED_RELEASE_REF}"
                ;;
            esac
          else
            RESOLVED_RELEASE_REF="$(bash ./shared/tools/ci/detect-base-branch.sh origin)"
            echo "Using detected fallback RELEASE_REF: ${RESOLVED_RELEASE_REF}"
          fi
          echo "RELEASE_REF=${RESOLVED_RELEASE_REF}" >> "$GITHUB_ENV"

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: "auto"
          python-version: "3.12"

      - name: Run tests via run_test.sh
        env:
          CIRCLE_BRANCH: ${{ github.ref_name }}
        run: |
          while IFS= read -r req_file; do
            [ -z "$req_file" ] && continue
            bash run_test.sh "$req_file"
          done <<< "${{ matrix.test_requirements }}"

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: connectors
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  # Single, stable job name to set as a required status check. Matrix entries
  # can't be required (their names change with the matrix content) and `test`
  # is skipped when there is nothing to run, so this job always runs and gives
  # one go/no-go.
  tests-summary:
    name: Tests Summary
    needs:
      - detect-test-files
      - test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        env:
          DETECT_RESULT: ${{ needs.detect-test-files.result }}
          HAS_TESTS: ${{ needs.detect-test-files.outputs.has_tests }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          # A failed detection leaves has_tests empty: not a clean "no tests".
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::Test detection did not succeed (result: $DETECT_RESULT)."
            exit 1
          fi
          if [ "$HAS_TESTS" != "true" ]; then
            echo "No relevant test files changed, nothing to run."
            exit 0
          fi
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::Connector tests did not succeed (result: $TEST_RESULT)."
            exit 1
          fi
          echo "All connector tests passed."
