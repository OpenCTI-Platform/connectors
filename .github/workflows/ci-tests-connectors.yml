name: Tests Connectors

on:
  pull_request:
  merge_group:
    branches:
      - master
      - lts/**
    types: [checks_requested]
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Native git diff (no third-party action): on pull_request, only build the
      # test matrix when a path that can affect connector tests changed.
      # build_test_matrix.py treats any change outside the connector directories
      # as "run everything", so docs-only or CI-only PRs must be cut off here.
      # Any other event (merge_group, workflow_call) always runs the full check.
      - name: Check if relevant paths changed
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --depth=1
          # Capture the full diff first: piping into `grep -q` can SIGPIPE git
          # under `bash -eo pipefail` and wrongly yield relevant=false.
          changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if grep -qE '^(connectors-sdk|external-import|internal-enrichment|internal-export-file|internal-import-file|stream|shared|templates)/|^run_test\.sh$' <<< "$changed_files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  detect-test-files:
    name: Detect test files
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_tests: ${{ steps.set-matrix.outputs.has_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # needed for git merge-base in build_test_matrix.py

      - name: Resolve RELEASE_REF
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            PR_BASE_REF="${{ github.event.merge_group.base_ref }}"
          else
            PR_BASE_REF="${{ github.base_ref }}"
          fi
          PR_BASE_REF="${PR_BASE_REF#refs/heads/}"

          if [ -n "${PR_BASE_REF:-}" ]; then
            case "${PR_BASE_REF}" in
              master|release/6.9.x|lts/*)
                RESOLVED_RELEASE_REF="${PR_BASE_REF}"
                echo "Using PR base branch for RELEASE_REF: ${RESOLVED_RELEASE_REF}"
                ;;
              *)
                RESOLVED_RELEASE_REF="$(bash ./shared/tools/ci/detect-base-branch.sh origin)"
                echo "PR base '${PR_BASE_REF}' is outside allowed refs, using fallback RELEASE_REF: ${RESOLVED_RELEASE_REF}"
                ;;
            esac
          else
            RESOLVED_RELEASE_REF="$(bash ./shared/tools/ci/detect-base-branch.sh origin)"
            echo "Using detected fallback RELEASE_REF: ${RESOLVED_RELEASE_REF}"
          fi
          echo "RELEASE_REF=${RESOLVED_RELEASE_REF}" >> "$GITHUB_ENV"

      - id: set-matrix
        name: Build test matrix from test-requirements.txt files
        run: python .github/scripts/build_test_matrix.py

  test:
    name: Test ${{ matrix.name }}
    needs:
      - detect-test-files
    if: needs.detect-test-files.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-test-files.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve RELEASE_REF
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            PR_BASE_REF="${{ github.event.merge_group.base_ref }}"
          else
            PR_BASE_REF="${{ github.base_ref }}"
          fi
          PR_BASE_REF="${PR_BASE_REF#refs/heads/}"

          if [ -n "${PR_BASE_REF:-}" ]; then
            case "${PR_BASE_REF}" in
              master|release/6.9.x|lts/*)
                RESOLVED_RELEASE_REF="${PR_BASE_REF}"
                echo "Using PR base branch for RELEASE_REF: ${RESOLVED_RELEASE_REF}"
                ;;
              *)
                RESOLVED_RELEASE_REF="$(bash ./shared/tools/ci/detect-base-branch.sh origin)"
                echo "PR base '${PR_BASE_REF}' is outside allowed refs, using fallback RELEASE_REF: ${RESOLVED_RELEASE_REF}"
                ;;
            esac
          else
            RESOLVED_RELEASE_REF="$(bash ./shared/tools/ci/detect-base-branch.sh origin)"
            echo "Using detected fallback RELEASE_REF: ${RESOLVED_RELEASE_REF}"
          fi
          echo "RELEASE_REF=${RESOLVED_RELEASE_REF}" >> "$GITHUB_ENV"

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: "auto"
          python-version: "3.12"

      - name: Run tests via run_test.sh
        env:
          CIRCLE_BRANCH: ${{ github.ref_name }}
        run: |
          while IFS= read -r req_file; do
            [ -z "$req_file" ] && continue
            bash run_test.sh "$req_file"
          done <<< "${{ matrix.test_requirements }}"

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: connectors
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  # Single, stable job name to set as a required status check. The `test`
  # job above runs as a dynamic matrix, so individual matrix entries can't be
  # marked required (their names change with the matrix content) and the
  # whole job is skipped when has_tests == 'false'. This job always runs
  # (if: always()) so it reports a status even when `test` is skipped,
  # and gives a single go/no-go based on the actual matrix outcome.
  tests-summary:
    name: Tests Summary
    needs:
      - detect-changes
      - detect-test-files
      - test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          result="${{ needs.test.result }}"
          changes_result="${{ needs.detect-changes.result }}"
          detect_result="${{ needs.detect-test-files.result }}"
          has_tests="${{ needs.detect-test-files.outputs.has_tests }}"

          # A failed or cancelled detection job leaves has_tests empty; that
          # must not be mistaken for a clean "no tests" outcome.
          if [ "$changes_result" != "success" ]; then
            echo "::error::Change detection did not succeed (result: $changes_result)."
            exit 1
          fi
          # `skipped` is legitimate only when detect-changes found nothing relevant.
          if [ "$detect_result" != "success" ] && [ "$detect_result" != "skipped" ]; then
            echo "::error::Test detection did not succeed (result: $detect_result)."
            exit 1
          fi

          if [ "$has_tests" != "true" ]; then
            echo "No relevant test files changed, nothing to run."
            exit 0
          fi

          case "$result" in
            success)
              echo "All connector tests passed."
              ;;
            skipped)
              echo "::error::Test matrix was skipped unexpectedly while tests were expected to run."
              exit 1
              ;;
            *)
              echo "::error::One or more connector tests failed (result: $result)."
              exit 1
              ;;
          esac
