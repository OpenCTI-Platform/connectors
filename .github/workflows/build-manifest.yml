name: Build Manifest

# Regenerates the connectors config schemas and the global manifest, then
# commits the result back to the branch it was called from, through the GitHub
# API so the commit is signed and shows as Verified.
#
# Called by build-all-connectors.yml (push on master / release/* / lts/*, and
# on version tags). workflow_dispatch is kept for manual runs on a branch.
#
# No standalone `push` trigger on purpose: build-all-connectors.yml already
# triggers on those refs and calls this workflow, so a push trigger here would
# run it twice concurrently and race on the commit-back.
#
# Nothing is committed when the caller ref is a tag: there is no branch to push
# to in that case, the manifest is already built on the branch the tag came from.
#
# Schema generation is parallelized: one matrix job per manager-supported
# connector, all of them regenerated unconditionally (not just the ones that
# changed) since the global manifest must stay complete even for untouched
# connectors. A single sequential job used to loop over every connector,
# which is what made this workflow slow.

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-manifest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect_connectors:
    name: Detect manager-supported connectors
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_connectors: ${{ steps.set-matrix.outputs.has_connectors }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: set-matrix
        name: Build manifest matrix from connector manifests
        run: python .github/scripts/build_manifest_matrix.py

  generate_config_schema:
    name: Generate schema ${{ matrix.name }}
    needs: detect_connectors
    if: needs.detect_connectors.outputs.has_connectors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect_connectors.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - name: Generate config schema
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r connector_path; do
            [ -z "$connector_path" ] && continue
            echo "::group::Generating schema for ${connector_path}"
            mise run generate_config_schema "$connector_path"
            echo "::endgroup::"
          done <<< "${{ matrix.connector_paths }}"

      # Uploaded to be collected by the build_manifest job below: each matrix
      # job only checks out/regenerates its own connector(s), so the schemas
      # need to be handed off rather than committed from here directly.
      - name: Upload generated schema
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-schema-${{ strategy.job-index }}
          path: |
            */*/__metadata__/connector_config_schema.json
            */*/__metadata__/CONNECTOR_CONFIG_DOC.md
          if-no-files-found: ignore
          retention-days: 1

  build_manifest:
    name: Build and Commit Manifest
    needs:
      - detect_connectors
      - generate_config_schema
    # Runs even if there were no manager-supported connectors (generate_config_schema
    # skipped) or if some individual schema jobs failed — the global manifest
    # still needs to be rebuilt from whatever schemas are available.
    if: |
      always() &&
      needs.detect_connectors.result == 'success' &&
      needs.generate_config_schema.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git push is performed: the commit is created through the GitHub
          # API, so the checkout token does not need to be persisted.
          persist-credentials: false

      - name: Download generated schemas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: manifest-schema-*
          path: .
          merge-multiple: true
        continue-on-error: true

      - name: Build global manifest
        shell: bash
        run: |
          set -euo pipefail
          bash ./shared/tools/composer/generate_global_manifest/generate_global_manifest.sh

      - name: Resolve target branch
        id: target
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "${REF_TYPE}" != "branch" ]; then
            echo "Ref '${REF_NAME}' is a ${REF_TYPE}, not a branch. Nothing to commit back."
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "branch=${REF_NAME}" >> "$GITHUB_OUTPUT"

      # The matrix above takes long enough that the branch may have moved
      # (new pushes landed) since this run started. Committing our generated
      # manifest/schemas on top of a tip we never actually built from would
      # silently mix stale and fresh content, so skip the commit entirely in
      # that case rather than force it through.
      - name: Check branch is still at the expected commit
        id: freshness
        if: steps.target.outputs.branch != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.target.outputs.branch }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/${REPO}/git/refs/heads/${BRANCH}" --jq '.object.sha')
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "::warning::Branch '${BRANCH}' moved from ${EXPECTED_SHA} to ${current_sha} while this workflow was running. Skipping manifest commit to avoid committing on top of newer changes."
            echo "still_head=false" >> "$GITHUB_OUTPUT"
          else
            echo "still_head=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN cannot push to the default branch: the `filigran`
      # enterprise ruleset requires a pull request there, and `github-actions`
      # is not an eligible bypass actor at enterprise level (only GitHub Apps
      # are). The `Connectors Manifest Bot` App is registered in that ruleset's
      # bypass list, so its installation token is what allows the commit back.
      #
      # Resolved right before the commit: installation tokens live for one
      # hour, and the generation steps above can be slow.
      - name: Generate GitHub App token
        id: app-token
        if: steps.target.outputs.branch != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_COMMIT_GITHUB_APP_ID }}
          private-key: ${{ secrets.RELEASE_COMMIT_GITHUB_APP_PRIVATE_KEY }}

      # Commits via GitHub's GraphQL API instead of raw `git commit`, so the
      # commit is GPG-signed by GitHub (required by this repo's branch
      # protection) without managing signing keys in CI. No local git
      # add/commit/push: it's a no-op when nothing was regenerated, and it
      # re-resolves the branch head through the API so it isn't affected by
      # non-fast-forward races from concurrent runs.
      #
      # `file_pattern` is a space-separated pathspec passed to `git status`,
      # scoped to the generated artifacts so the virtualenvs and temp files
      # created by the generation scripts never enter the commit. Untracked
      # (new) schemas and deletions are both picked up.
      #
      # continue-on-error: this repo's branch protection rules are currently
      # too strict for the bot commit to always go through. That's a
      # separate, known issue — it must not turn this whole build red; the
      # step below just surfaces a warning instead.
      - name: Commit manifest if changed
        id: commit
        if: steps.target.outputs.branch != '' && steps.freshness.outputs.still_head == 'true'
        continue-on-error: true
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "chore(manifest): build and update manifest [skip ci]"
          repo: ${{ github.repository }}
          branch: ${{ steps.target.outputs.branch }}
          file_pattern: "manifest.json */__metadata__/connector_config_schema.json */__metadata__/CONNECTOR_CONFIG_DOC.md"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Warn if manifest commit failed
        if: steps.target.outputs.branch != '' && steps.freshness.outputs.still_head == 'true' && steps.commit.outcome == 'failure'
        run: |
          echo "::warning::Failed to commit the updated manifest/schemas back to '${{ steps.target.outputs.branch }}' (likely blocked by branch protection rules). This does not fail the build — investigate/commit manually if needed."
