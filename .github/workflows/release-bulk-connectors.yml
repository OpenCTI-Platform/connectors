name: "Release Connectors (bulk)"

# Dynamic run name shown in the Actions run list, so it's obvious at a glance
# which connectors/version a bulk run targets instead of a generic "Release
# Connectors (bulk) #NNN". Same context limitation as release-connector.yml:
# only `github`, `inputs`, `vars` are available here.
run-name: >-
  ${{
    github.event_name == 'push'
      && format('🚀 bulk (platform tag {0})', github.ref_name)
      || format('🚀 bulk: {0}{1}{2}{3}',
           inputs.connectors,
           inputs.version != '' && format('@{0}', inputs.version) || '',
           inputs.dry_run && ' · dry-run' || '',
           inputs.manifest_only && ' · manifest-only' || '')
  }}

# Bulk release orchestrator.
#
# Resolves a set of connectors (a named list or "all") and a single shared CalVer
# version, then dispatches one independent `release-connector.yml` run per
# connector via workflow_dispatch. Each dispatched run performs the full per-
# connector pipeline (build → push → create the GitHub Release, which creates the
# tag). This workflow itself does no building or tagging.
#
# Why dispatch instead of pushing tags or a matrix?
#   - workflow_dispatch events always create a workflow run, even when triggered
#     with the default GITHUB_TOKEN (unlike tag pushes, which do not) — so no PAT
#     is required.
#   - One run per connector is not bound by the 256-job matrix limit, so "all"
#     (250+ connectors) works in a single orchestration.
#
# Use cases: shared-dependency security fix, pycti bump, connectors-sdk breaking
# change, LTS alignment.
#
# Transition trigger — platform CalVer tag push (e.g. `7.260706.0`):
# automatically runs a manifest-only bulk release for every connector. Each
# dispatched per-connector run still produces its full tag, GitHub Release,
# manifest fragment, and container_version commit-back — only the Docker
# build/push step is skipped, since image builds for the platform release are
# still handled by CircleCI at this stage. This lets the platform release keep
# flowing through the current CircleCI pipeline while per-connector tags,
# releases, and manifest fragments are produced in parallel via GitHub Actions.

on:
  push:
    tags:
      # Platform (OCTI) CalVer release tags, e.g. 7.260706.0. These never
      # contain '/', unlike per-connector tags `{name}/{version}` matched by
      # release-connector.yml's own '*/*' filter (glob '*' does not match
      # '/', so the two patterns can never collide).
      # LTS platform tags (e.g. 7.260706.0-lts.1) also match this pattern and
      # are supported: bulk_release.py validates both MAJOR.YYMMDD.PATCH and the
      # `-lts.N` variant, so an LTS tag produces LTS per-connector releases.
      - '*.*.*'
  workflow_dispatch:
    inputs:
      connectors:
        description: >
          Connectors to release: "all" or a comma-separated list
          (e.g. "mitre,crowdstrike").
        required: true
        type: string
        default: "all"
      version:
        description: >
          Optional CalVer to tag, same for all connectors (e.g. 7.260706.0).
          Leave empty to auto-compute today's 7.YYMMDD.0.
        required: false
        type: string
        default: ""
      manifest_only:
        description: >
          Manifest-only — skip Docker build/push only for every dispatched
          connector (still handled by CircleCI during the transition). Tag,
          GitHub Release, manifest fragment, and container_version
          commit-back are still fully produced for each connector. Always
          forced to true when this workflow is triggered by a platform
          CalVer tag push.
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Dry run — Do not publish any tags or GitHub Releases, only test release process"
        required: false
        type: boolean
        default: true

concurrency:
  group: release-bulk-connectors
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bulk-release:
    name: Dispatch connector releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to dispatch release-connector.yml via `gh workflow run`.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Determine effective inputs
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_CONNECTORS: ${{ inputs.connectors }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MANIFEST_ONLY: ${{ inputs.manifest_only }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            # Platform CalVer tag push: dispatch a full release (tag, GitHub
            # Release, manifest fragment, commit-back) for every connector at
            # this exact version, but skip the Docker build — still on CircleCI.
            echo "connectors=all" >> "$GITHUB_OUTPUT"
            echo "version=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "manifest_only=true" >> "$GITHUB_OUTPUT"
            echo "🏷️ Platform release tag: ${TAG_NAME} → bulk manifest-only run for all connectors"
          else
            echo "connectors=${INPUT_CONNECTORS}" >> "$GITHUB_OUTPUT"
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${INPUT_DRY_RUN}" >> "$GITHUB_OUTPUT"
            echo "manifest_only=${INPUT_MANIFEST_ONLY}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve connectors and version
        id: resolve
        env:
          CONNECTORS: ${{ steps.trigger.outputs.connectors }}
          VERSION: ${{ steps.trigger.outputs.version }}
          DRY_RUN: ${{ steps.trigger.outputs.dry_run }}
          MANIFEST_ONLY: ${{ steps.trigger.outputs.manifest_only }}
        run: |
          set -euo pipefail

          ARGS=()
          if [ "${CONNECTORS,,}" = "all" ]; then
            ARGS+=("--all")
          else
            ARGS+=("--connectors" "${CONNECTORS}")
          fi

          if [ -n "${VERSION}" ]; then
            ARGS+=("--version" "${VERSION}")
          fi

          # A dry run previews the full intended set, including connectors already
          # released at this version. A real run (manifest-only or not) skips them,
          # since it creates a real tag/GitHub Release per connector and re-running
          # for an already-released version would collide with the existing tag.
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS+=("--include-released")
          fi

          # bulk_release.py writes the resolved version, and the full
          # pending/skipped table (with skip reasons), to $GITHUB_STEP_SUMMARY
          # itself — this runs for both dry runs and real dispatches, unlike
          # the dispatch step below which only runs on a real dispatch. This
          # is also the only place the *actual* resolved version is visible:
          # the run-name is rendered before this job starts, so it only ever
          # has access to the raw `inputs.version` (possibly empty), never
          # the value auto-computed here.
          python .github/scripts/bulk_release.py "${ARGS[@]}"

      - name: Dispatch per-connector releases
        id: dispatch
        if: ${{ steps.resolve.outputs.has_connectors == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONNECTORS_JSON: ${{ steps.resolve.outputs.connectors }}
          VERSION: ${{ steps.resolve.outputs.version }}
          MANIFEST_ONLY: ${{ steps.trigger.outputs.manifest_only }}
          REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ steps.trigger.outputs.dry_run }}
        run: |
          set -euo pipefail

          # Recorded before any run is dispatched so the tracking step below
          # can safely disambiguate "this bulk run's dispatches" from any
          # earlier/unrelated release-connector.yml runs sharing the same
          # display title (e.g. a re-run of the same connector/version).
          echo "start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          {
            echo "## Bulk release — version \`$VERSION\`"
            echo ""
            if [ "$MANIFEST_ONLY" = "true" ]; then
              echo "🧩 **Manifest-only mode** — Docker build/push is skipped for every connector (still handled by CircleCI during the transition). Tag, GitHub Release, manifest fragment, and container_version commit-back are still fully produced for each connector."
              echo ""
            fi
            echo "Dispatching connector release(s) on ref \`$REF\`."
            echo ""
            echo "| Connector | Target | Status | Track |"
            echo "|-----------|--------|--------|-------|"
          } >> "$GITHUB_STEP_SUMMARY"

          ok=0
          failed=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            target_label="${name}/${VERSION}"
            # No extra API call needed: the run-name for workflow_dispatch always
            # embeds "{connector}/{version}" verbatim, and the Actions runs page
            # `query` param does a plain-text match against it — so this link
            # filters straight to this connector's own run(s), free of charge.
            track_url="https://github.com/${REPO}/actions/workflows/release-connector.yml?query=%22${target_label}%22"
            if gh workflow run release-connector.yml \
                 --ref "$REF" \
                 -f connector_name="$name" \
                 -f version="$VERSION" \
                 -f dry_run="$DRY_RUN" \
                 -f manifest_only="$MANIFEST_ONLY"; then
              echo "| $name | $target_label | ✅ dispatched | [view run]($track_url) |" >> "$GITHUB_STEP_SUMMARY"
              ok=$((ok + 1))
            else
              echo "| $name | $target_label | ❌ dispatch failed | [view run]($track_url) |" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
            fi
            # Space out mutating API calls to stay clear of secondary rate limits.
            sleep 2
          done < <(printf '%s' "$CONNECTORS_JSON" | jq -r '.[]')

          {
            echo ""
            echo "**${ok} dispatched, ${failed} failed.**"
            echo ""
            echo "🔎 Track the runs: https://github.com/${REPO}/actions/workflows/release-connector.yml"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "✅ ${ok} dispatched, ${failed} failed."
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi

      # Runs even if some dispatches failed above (always()), so the dashboard
      # still reflects whatever was actually dispatched. Polls each dispatched
      # release-connector.yml run and re-renders a single live status table in
      # the job summary until every run reaches a terminal state or the
      # timeout is hit. One read-only ubuntu-latest job for the whole batch —
      # no per-connector runners, no mutating API calls, so no secondary
      # rate-limit risk.
      - name: Track release status
        if: always() && steps.resolve.outputs.has_connectors == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONNECTORS_JSON: ${{ steps.resolve.outputs.connectors }}
          VERSION: ${{ steps.resolve.outputs.version }}
          MANIFEST_ONLY: ${{ steps.trigger.outputs.manifest_only }}
          DRY_RUN: ${{ steps.trigger.outputs.dry_run }}
          START_TIME: ${{ steps.dispatch.outputs.start_time }}
        run: |
          set -uo pipefail

          if [ -z "$START_TIME" ]; then
            echo "ℹ️ No dispatches recorded (dispatch step didn't run) — skipping tracking."
            exit 0
          fi

          POLL_INTERVAL=20
          MAX_WAIT=2700  # 45 minutes
          elapsed=0

          # Snapshot the summary as written by the dispatch step so each
          # re-render below can restore it before appending the fresh table —
          # otherwise overwriting $GITHUB_STEP_SUMMARY here would wipe it,
          # since it's one shared file across every step in the job.
          cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/summary_base.md" 2>/dev/null || : > "$RUNNER_TEMP/summary_base.md"

          mapfile -t NAMES < <(printf '%s' "$CONNECTORS_JSON" | jq -r '.[]')

          # Must match release-connector.yml's run-name template exactly:
          # "🚀 {connector_name}@{version}[ · dry-run][ · manifest-only]"
          declare -A TITLE_OF
          for name in "${NAMES[@]}"; do
            title="🚀 ${name}@${VERSION}"
            [ "$DRY_RUN" = "true" ] && title="${title} · dry-run"
            [ "$MANIFEST_ONLY" = "true" ] && title="${title} · manifest-only"
            TITLE_OF["$name"]="$title"
          done

          declare -A STATUS_OF
          declare -A URL_OF
          for name in "${NAMES[@]}"; do
            STATUS_OF["$name"]="⏳ not started"
          done

          render_summary() {
            local ok=0 failed=0 pending=0
            for name in "${NAMES[@]}"; do
              case "${STATUS_OF[$name]}" in
                "✅"*) ok=$((ok + 1)) ;;
                "❌"*) failed=$((failed + 1)) ;;
                *) pending=$((pending + 1)) ;;
              esac
            done

            cat "$RUNNER_TEMP/summary_base.md" > "$GITHUB_STEP_SUMMARY"
            {
              echo ""
              echo "## 📊 Live release status (${ok} ✅ · ${failed} ❌ · ${pending} ⏳)"
              echo ""
              echo "| Connector | Status | Run |"
              echo "|-----------|--------|-----|"
              for name in "${NAMES[@]}"; do
                url="${URL_OF[$name]:-}"
                link=""
                [ -n "$url" ] && link="[view]($url)"
                echo "| $name | ${STATUS_OF[$name]} | $link |"
              done
              echo ""
              echo "_Last updated: $(date -u +%Y-%m-%dT%H:%M:%SZ) — refresh this page to see updates._"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "$ok" > "$RUNNER_TEMP/ok_count"
            echo "$failed" > "$RUNNER_TEMP/failed_count"
            echo "$pending" > "$RUNNER_TEMP/pending_count"
          }

          while :; do
            runs_json=$(gh run list --workflow=release-connector.yml \
              --json databaseId,displayTitle,status,conclusion,url,createdAt -L 500 2>/dev/null || echo '[]')

            for name in "${NAMES[@]}"; do
              # Skip lookups for connectors already in a terminal state.
              case "${STATUS_OF[$name]}" in
                "✅"*|"❌"*|"⛔"*) continue ;;
              esac

              title="${TITLE_OF[$name]}"
              run=$(echo "$runs_json" | jq -c --arg t "$title" --arg start "$START_TIME" \
                '[.[] | select(.displayTitle == $t and .createdAt >= $start)] | sort_by(.createdAt) | last // empty')

              [ -z "$run" ] || [ "$run" = "null" ] && continue

              status=$(echo "$run" | jq -r '.status')
              conclusion=$(echo "$run" | jq -r '.conclusion')
              url=$(echo "$run" | jq -r '.url')
              URL_OF["$name"]="$url"

              case "$status" in
                queued) STATUS_OF["$name"]="⏳ queued" ;;
                in_progress) STATUS_OF["$name"]="🔄 running" ;;
                completed)
                  case "$conclusion" in
                    success) STATUS_OF["$name"]="✅ success" ;;
                    failure) STATUS_OF["$name"]="❌ failure" ;;
                    cancelled) STATUS_OF["$name"]="⛔ cancelled" ;;
                    *) STATUS_OF["$name"]="⚠️ ${conclusion}" ;;
                  esac
                  ;;
                *) STATUS_OF["$name"]="⏳ ${status}" ;;
              esac
            done

            render_summary

            all_done=true
            for name in "${NAMES[@]}"; do
              case "${STATUS_OF[$name]}" in
                "✅"*|"❌"*|"⛔"*|"⚠️"*) ;;
                *) all_done=false ;;
              esac
            done
            [ "$all_done" = "true" ] && break

            [ "$elapsed" -ge "$MAX_WAIT" ] && { echo "::warning::Tracking timed out after ${MAX_WAIT}s, some connectors still in progress."; break; }

            sleep "$POLL_INTERVAL"
            elapsed=$((elapsed + POLL_INTERVAL))
          done

          ok=$(cat "$RUNNER_TEMP/ok_count")
          failed=$(cat "$RUNNER_TEMP/failed_count")
          pending=$(cat "$RUNNER_TEMP/pending_count")
          echo "📊 Final: ${ok} succeeded, ${failed} failed, ${pending} still pending/unknown."

          if [ "$failed" -gt 0 ]; then
            exit 1
          fi

