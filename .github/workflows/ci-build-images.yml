name: Build Images Check

# Test-builds (no push) the connector images a merge would build, so a broken
# image is caught by the merge queue instead of on master after merge.
#
# Builds only run on merge_group: once per merge attempt, never on each push
# to a PR. On pull_request only the summary job runs (a few seconds), because
# a required status check must also report on the PR before it can be queued.
#
# Scope (see .github/scripts/build_image_check_matrix.py): the connectors
# whose directory changed, Alpine + UBI9 (when listed), amd64 + arm64, like
# master. Repo-wide changes above the cap are left to the master build.

on:
  pull_request:
  merge_group:
    branches:
      - master
      - lts/**
    types: [checks_requested]

permissions:
  contents: read

jobs:
  detect:
    name: Detect images to build
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_builds: ${{ steps.set-matrix.outputs.has_builds }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # base_sha may be several commits behind when the queue groups PRs.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Generate build matrix
        id: set-matrix
        env:
          DIFF_BASE: ${{ github.event.merge_group.base_sha }}
          DIFF_HEAD: ${{ github.event.merge_group.head_sha }}
        run: python3 .github/scripts/build_image_check_matrix.py

  build:
    name: Build ${{ matrix.variant }}/${{ matrix.name }} (${{ matrix.arch }})
    needs: detect
    if: needs.detect.outputs.has_builds == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # Read by buildx_with_retry.sh (inherited by the composite action steps).
      # Master keeps 5 attempts with a 60s backoff to ride out registry rate
      # limits while pushing ~300 images; here one retry is enough, so a
      # deterministic failure (missing package, bad requirement) fails in
      # minutes instead of ~20.
      MAX_ATTEMPTS: "2"
      INITIAL_DELAY: "30"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            ${{ matrix.path }}
            .github
            shared
            connectors-sdk
            Dockerfile_ubi9
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No registry login on purpose: this job runs code that is not merged
      # yet (it can change the build action), so it must not hold the
      # publishing credentials. Base images are pulled anonymously.
      - name: Build connector image (no push)
        uses: ./.github/actions/build-connector-image
        with:
          connector_path: ${{ matrix.path }}
          connector_name: ${{ matrix.name }}
          fips: ${{ matrix.fips }}
          image_tags: ci-check
          # rolling: pycti/connectors-sdk resolve to the base branch, as they
          # will in the master build right after the merge.
          build_mode: rolling
          platforms: ${{ matrix.platform }}
          push: "false"
          dockerfile: ${{ matrix.dockerfile }}
          variant: ${{ matrix.build_variant }}

  # Single stable name to mark as a required status check (matrix job names
  # change with every PR).
  summary:
    name: Image Build Summary
    if: always()
    needs: [detect, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          EVENT: ${{ github.event_name }}
          DETECT: ${{ needs.detect.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          if [ "$EVENT" != "merge_group" ]; then
            echo "Image builds run in the merge queue only."
            exit 0
          fi
          echo "detect: $DETECT | build: $BUILD"
          if [ "$DETECT" != "success" ]; then
            echo "::error::Build matrix generation failed"
            exit 1
          fi
          case "$BUILD" in
            success|skipped) echo "✅ Images build" ;;
            *) echo "::error::At least one image failed to build"; exit 1 ;;
          esac
