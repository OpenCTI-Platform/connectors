# git-cliff ~ configuration file for per-connector releases
# https://git-cliff.org/docs/configuration
#
# Unlike the repository-wide `cliff.toml`, this config deliberately has NO
# `[remote.github]` section and no `commit.remote` / `github.*` template
# references. git-cliff only queries the GitHub REST API when the template
# needs remote data, and that query paginates the WHOLE repository history
# (hundreds of requests on this monorepo). Since connector releases are scoped
# to a single directory and can run many times per hour, that quickly exhausts
# the API budget and fails the job with HTTP 403.
#
# PR / issue links are therefore rebuilt locally from the commit message
# (`... (#1234)`), which GitHub resolves to either a PR or an issue.

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and connector releases in this repository use CalVer in the form `7.YYMMDD.PATCH`.
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {%- for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}
    {%- endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = false
commit_preprocessors = [
  # Turn the trailing issue/PR reference into a link instead of dropping it.
  # GitHub redirects /issues/<n> to /pull/<n> when the number is a PR.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/OpenCTI-Platform/connectors/issues/${2}))" },
]
commit_parsers = [
    # Skip merge commits and release commits
    { message = "^Merge", skip = true },
    { message = '^\[all\] Release', skip = true },

    # Dependency updates (Renovate, Dependabot) — dedicated group
    { message = '^\w+\(deps\)', group = "Dependencies" },

    # Standard conventional commit types
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Style" },
    { message = "^revert", group = "Revert" },
    { message = "^test", group = "Tests" },
    { message = "^chore\\(version\\):", skip = true },
    { message = "^chore", group = "Miscellaneous Chores" },
    { body = ".*security", group = "Security" },

    # Catch-all for non-conventional commits (legacy bracket format, etc.)
    { message = ".*", group = "Other" },
]
filter_commits = false
topo_order = false
sort_commits = "newest"
