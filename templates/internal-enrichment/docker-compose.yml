version: '3'
services:
  connector-template:
    image: opencti/connector-template:latest # 'template' being the name of connector's directory
    environment:
      # Generic parameters (connection with OpenCTI)
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=CHANGEME
      # Common parameters for connectors of type INTERNAL_ENRICHMENT
      - CONNECTOR_ID=CHANGEME
      - CONNECTOR_NAME=CHANGEME # optional (default: 'TemplateConnector')
      - CONNECTOR_SCOPE=IPv4-Addr # optional, OpenCTI entity types to enrich, each handled by a processor (default: 'IPv4-Addr')
      - CONNECTOR_LOG_LEVEL=error # optional (default: 'error')
      - CONNECTOR_AUTO=false # optional (default: false)
      - CONNECTOR_MAX_TLP=green # optional, highest TLP of the entities to enrich, available values: 'clear', 'white', 'green', 'amber', 'amber+strict', 'red' (default: 'green')
      # Custom parameters for connector-template
      - TEMPLATE_API_BASE_URL=https://api.example.com/v1 # optional (default: 'https://api.example.com/v1')
      - TEMPLATE_API_KEY=CHANGEME
      - TEMPLATE_CREATE_AUTONOMOUS_SYSTEM=true # optional, create the autonomous system of the IP address (default: true)
    restart: always
