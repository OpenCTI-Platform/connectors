version: '3'
services:
  connector-sochain:
    image: opencti/connector-sochain:latest
    environment:
      # Generic parameters (connection with OpenCTI)
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      # Common parameters for connectors of type INTERNAL_ENRICHMENT
      - CONNECTOR_ID=ChangeMe
      # - CONNECTOR_NAME=SoChain # optional (default: 'SoChain')
      # - CONNECTOR_SCOPE=Cryptocurrency-Wallet # optional (default: 'Cryptocurrency-Wallet')
      # - CONNECTOR_LOG_LEVEL=error # optional (default: 'error')
      # - CONNECTOR_AUTO=false # optional (default: false)
      # - CONNECTOR_MAX_TLP=TLP:AMBER # optional, available values: 'TLP:CLEAR', 'TLP:WHITE', 'TLP:GREEN', 'TLP:AMBER', 'TLP:AMBER+STRICT', 'TLP:RED' (default: 'TLP:AMBER')
      # Custom parameters for connector-sochain
      # - SOCHAIN_API_BASE_URL=https://sochain.com/api/v3 # optional (default: 'https://sochain.com/api/v3')
      # - SOCHAIN_API_KEY=ChangeMe # optional, leave commented out for keyless lookups (2,500 a day per IP); get a key at https://sochain.com/dashboard
      # - SOCHAIN_CHECK_POISONING=true # optional (default: true)
    restart: always
