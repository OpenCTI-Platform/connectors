services:
  connector-polyswarm-enrichment:
    image: opencti/connector-polyswarm-enrichment:latest
    environment:
      # ========== OpenCTI Configuration ==========
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=${OPENCTI_TOKEN}

      # ========== Connector Configuration ==========
      - CONNECTOR_ID=${CONNECTOR_ID}
      # - CONNECTOR_TYPE=INTERNAL_ENRICHMENT
      # - CONNECTOR_NAME=PolySwarm Hash Enrichment
      # - CONNECTOR_SCOPE=StixFile,Artifact,Url,Domain-Name,IPv4-Addr,IPv6-Addr
      # Keep false: auto-enrichment would send every in-scope URL, domain and IP to PolySwarm
      # - CONNECTOR_AUTO=false
      # - CONNECTOR_LOG_LEVEL=info
      # - CONNECTOR_MAX_TLP=TLP:RED

      # ========== PolySwarm Configuration ==========
      - POLYSWARM_API_KEY=${POLYSWARM_API_KEY}
      # - POLYSWARM_COMMUNITY=default
      # - POLYSWARM_MAX_POLLING_TIME=120
      # - POLYSWARM_POLYKG_API_URL=
      # - POLYSWARM_RESCAN_OLDER_THAN_DAYS=0
      # - POLYSWARM_RESCAN_TIMEOUT=300
      # WARNING: true stores LIVE MALWARE in OpenCTI as an Artifact
      # - POLYSWARM_DOWNLOAD_SAMPLE=false
      # - POLYSWARM_DOWNLOAD_MAX_SIZE_MB=20
      # - POLYSWARM_NETWORK_RELATED_FILES_MAX=10
      # - POLYSWARM_NETWORK_INDICATOR_MIN_DETECTIONS=2
      # - POLYSWARM_NETWORK_URL_SEND_QUERY=false
      # - POLYSWARM_QUOTA_WARN_BELOW=100
      # Pivots spend extra PolySwarm lookups, so both are off (0) by default
      # - POLYSWARM_PIVOT_IMPHASH_MAX=0
      # - POLYSWARM_PIVOT_TTP_MAX=0
      # YARA hunting: creates hunts in your PolySwarm account, spends hunt quota,
      # sends the rule text to PolySwarm. Adds Indicator to the scope when true.
      # - POLYSWARM_YARA_HUNT_ENABLED=false
      # - POLYSWARM_YARA_HUNT_WINDOW_DAYS=30
      # - POLYSWARM_YARA_HUNT_TIMEOUT=300
      # - POLYSWARM_YARA_HUNT_MAX_RESULTS=50
    restart: always
