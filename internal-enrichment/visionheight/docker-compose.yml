version: '3'
services:
  connector-visionheight:
    image: opencti/connector-visionheight:latest # 'visionheight' being the name of connector's directory
    environment:
      # Generic parameters (connection with OpenCTI)
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      # Common parameters for connectors of type INTERNAL_ENRICHMENT
      - CONNECTOR_ID=ChangeMe
      #- CONNECTOR_NAME=VisionHeight # optional (default: 'VisionHeight')
      #- CONNECTOR_SCOPE=IPv4-Addr,Domain-Name # optional (default: 'IPv4-Addr,Domain-Name')
      #- CONNECTOR_LOG_LEVEL=error # optional (default: 'error')
      #- CONNECTOR_AUTO=false # optional (default: false)
      #- CONNECTOR_MAX_TLP=TLP:AMBER+STRICT # optional, available values: 'TLP:CLEAR', 'TLP:WHITE', 'TLP:GREEN', 'TLP:AMBER', 'TLP:AMBER+STRICT', 'TLP:RED' (default: 'TLP:AMBER+STRICT')
      # Custom parameters for connector-visionheight
      #- VISIONHEIGHT_API_BASE_URL=https://api.visionheight.com # optional (default: 'https://api.visionheight.com')
      - VISIONHEIGHT_API_KEY=ChangeMe
    restart: always