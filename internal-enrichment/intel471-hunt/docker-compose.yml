services:
  connector-intel471-hunt:
    image: opencti/connector-intel471-hunt:latest
    environment:
      # Generic parameters (connection with OpenCTI)
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      # Common parameters for connectors of type INTERNAL_ENRICHMENT
      - CONNECTOR_ID=ChangeMe
      # - CONNECTOR_NAME=Intel 471 Hunter # optional (default: 'Intel 471 Hunter')
      # Scope doubles as the enrichment import type-filter: EVERY type the
      # connector emits must be listed, or OpenCTI silently drops it. Report,
      # Indicator and Note are outputs (not trigger types) but must be present.
      # - CONNECTOR_SCOPE=Report,Indicator,Note,Intrusion-Set,Threat-Actor,Threat-Actor-Group,Threat-Actor-Individual,Campaign,Attack-Pattern,Vulnerability,Malware,Tool,Sector,Country,Region # optional
      # - CONNECTOR_AUTO=false # optional (default: false)
      # - CONNECTOR_LOG_LEVEL=error # optional (default: 'error')
      # Custom parameters for connector-intel471-hunt
      - HUNTER_API_KEY=ChangeMe
      # - HUNTER_API_BASE_URL=https://api.hunter.cyborgsecurity.io # optional
      # - HUNTER_UI_BASE_URL=https://hunter.cyborgsecurity.io # optional
      # - HUNTER_INDEXES=cyborg_usecases # optional
      # - HUNTER_REQUEST_TIMEOUT_SECONDS=30 # optional
      # - HUNTER_MAX_RESULTS_PER_QUERY=100 # optional
      # - HUNTER_CACHE_PATH=/opt/opencti-connector-intel471-hunt/cache/cache.json # optional
      # - HUNTER_CACHE_TTL_HOURS=24 # optional
      # - HUNTER_MAX_TLP=TLP:AMBER # optional
    volumes:
      # Mount the cache on a DEDICATED subdir — NEVER on the WORKDIR itself.
      # That directory holds the connector code (src/); a named volume mounted
      # there gets seeded once from the first image and then SHADOWS the code on
      # every subsequent image update, silently pinning the container to stale code.
      - intel471-hunt-cache:/opt/opencti-connector-intel471-hunt/cache
    restart: always

volumes:
  intel471-hunt-cache:
