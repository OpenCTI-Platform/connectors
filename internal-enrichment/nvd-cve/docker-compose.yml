version: '3'
services:
  connector-cve-enrichment:
    image: opencti/connector-cve-enrichment:latest
    environment:
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe
      - CONNECTOR_TYPE=INTERNAL_ENRICHMENT
      - CONNECTOR_NAME=NIST NVD CVE Enrichment
      - CONNECTOR_SCOPE=Report,Grouping,Note,Observed-Data,Opinion,Case-Incident,Case-Rfi,Case-Rft,Task,Feedback,Incident,Vulnerability
      - CONNECTOR_AUTO=true
      - CONNECTOR_MAX_TLP=TLP:AMBER
      - CONNECTOR_LOG_LEVEL=info
      - CVE_API_KEY=ChangeMe # Required
      # - CVE_BASE_URL=https://services.nvd.nist.gov/rest/json/cves # Optional
      # - CVE_CREATE_UNMATCHED_CVE=true # Optional, create placeholder Vulnerability if NVD has no entry yet
      # - CVE_CREATE_RELATIONSHIPS=true # Optional, create related-to relationships in addition to object_refs
      # - CVE_IMPORT_SOFTWARE=false # if true, resolve CPEs and import as Software objects
      # - CVE_CPE_HISTORY_INTERVAL=P120D # Optional, interval to look back for CPE modifications (ISO 8601 duration format)
      # - CVE_CVE_MAX_CONCURRENCY=50 # Maximum number of concurrent CVE processing workers
      # - CVE_CPE_MAX_CONCURRENCY=10  # Maximum number of concurrent CPE resolution tasks
    restart: always
