opencti:
  url: "${OPENCTI_URL}"
  token: "${OPENCTI_TOKEN_ZETALYTICS_AUTO_LIGHT}"

connector:
  id: "00000000-0000-4000-8000-000000000103"
  name: "Zetalytics DNS - Auto Light"
  type: "INTERNAL_ENRICHMENT"
  scope: "Domain-Name,Hostname,IPv4-Addr,IPv6-Addr"
  auto: true
  log_level: "info"

zetalytics:
  token: "${ZETALYTICS_TOKEN}"
  mode: "light"
  max_tlp: "TLP:AMBER"
  max_results: 25
  max_subdomains: 0
  max_whois_results: 0
  max_ns_pivot_results: 0
  max_mx_pivot_results: 0
  lookback_days: 90
  tsfield: "last_seen"
  include_live_dns: false
  include_subdomains: false
  include_d8s: false
  include_historical_whois: false
  include_ns_glue: false
  include_ns2domain: false
  include_mx2domain: false
  include_email_pivots: false
  confidence: 40
  marking_definition: "TLP:AMBER"
  create_note_when_no_results: false
  include_portal_link: false
