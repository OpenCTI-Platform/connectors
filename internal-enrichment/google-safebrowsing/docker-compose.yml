version: '3'
services:
  connector-google-safebrowsing:
    image: opencti/connector-google-safebrowsing:latest
    environment:
      # Connector's generic execution parameters:
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      # Connector's definition parameters:
      - CONNECTOR_ID=ChangeMe
      # - CONNECTOR_NAME=Google Safe Browsing
      # - CONNECTOR_SCOPE=Url,Domain-Name,Hostname
      # - CONNECTOR_LOG_LEVEL=error
      # - CONNECTOR_AUTO=false
      # - CONNECTOR_MAX_TLP=amber
      # Connector's custom execution parameters:
      - SAFE_BROWSING_API_KEY=ChangeMe # Your Google/Yandex Safe Browsing API key
      # - SAFE_BROWSING_API_URL=https://safebrowsing.googleapis.com # Use https://sba.yandex.net for Yandex
      # Deprecated (use SAFE_BROWSING_API_KEY instead), used only if SAFE_BROWSING_API_KEY is unset:
      # - GOOGLE_SAFE_BROWSING_API_KEY=ChangeMe
    restart: always
