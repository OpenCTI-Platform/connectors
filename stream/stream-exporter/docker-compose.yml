version: '3'
services:
  connector-stream-exporter:
    image: opencti/connector-stream-exporter:latest
    environment:
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe
      - CONNECTOR_LIVE_STREAM_ID=ChangeMe # ID of the live stream created in the OpenCTI UI
      - CONNECTOR_LIVE_STREAM_LISTEN_DELETE=true
      - CONNECTOR_LIVE_STREAM_NO_DEPENDENCIES=false
      - CONNECTOR_NAME=StreamExporterConnector
      - CONNECTOR_SCOPE=stream
      - CONNECTOR_LOG_LEVEL=info
      - STREAM_EXPORTER_S3_ENDPOINT=minio
      - STREAM_EXPORTER_S3_PORT=9000
      - STREAM_EXPORTER_S3_BUCKET=opencti-export
      - STREAM_EXPORTER_S3_FOLDER=opencti-stream
      - STREAM_EXPORTER_S3_ACCESS_KEY=opencti
      - STREAM_EXPORTER_S3_SECRET_KEY=ChangeMe
      - STREAM_EXPORTER_S3_SECURE=false
      - STREAM_EXPORTER_S3_CERT_CHECK=false
      - WRITE_EVERY_SEC=10
    restart: always
