version: '3'
services:
  connector-zscaler:
    image: opencti/connector-zscaler:latest
    environment:
      # --- OpenCTI ---
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe
      - CONNECTOR_NAME=Zscaler
      - CONNECTOR_SCOPE=domain-name
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_LIVE_STREAM_ID=ChangeMe
      - CONNECTOR_LIVE_STREAM_LISTEN_DELETE=true
      - CONNECTOR_LIVE_STREAM_NO_DEPENDENCIES=true
      # --- Zscaler ---
      - ZSCALER_CLIENT_ID=ChangeMe
      - ZSCALER_CLIENT_SECRET=ChangeMe
      - ZSCALER_VANITY_DOMAIN=ChangeMe
      # - ZSCALER_CLOUD=beta # optional (default: production cloud, api.zsapi.net)
      # - ZSCALER_BLACKLIST_NAME=BLACK_LIST_DYNDNS # optional, URL category ID such as CUSTOM_01 (default: BLACK_LIST_DYNDNS)
      # - ZSCALER_SSL_VERIFY=true # optional (default: true)
    restart: always
