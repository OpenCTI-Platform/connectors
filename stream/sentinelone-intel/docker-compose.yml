version: '3'
services:
  connector-sentinelone-intel:
    image: opencti/connector-sentinelone-intel:latest
    environment:
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe
      - CONNECTOR_NAME=SentinelOne Intel Stream Connector
      - CONNECTOR_SCOPE=ChangeMe
      - CONNECTOR_LOG_LEVEL=error
      - CONNECTOR_LIVE_STREAM_ID=ChangeMe # ID of the live stream created in the OpenCTI UI
      - CONNECTOR_LIVE_STREAM_LISTEN_DELETE=true
      - CONNECTOR_LIVE_STREAM_NO_DEPENDENCIES=true
      - SENTINELONE_INTEL_API_URL=ChangeMe
      - SENTINELONE_INTEL_API_KEY=ChangeMe
      - SENTINELONE_INTEL_ACCOUNT_ID=ChangeMe_OR_EMPTY
      - SENTINELONE_INTEL_SITE_ID=ChangeMe_OR_EMPTY
      - SENTINELONE_INTEL_GROUP_ID=ChangeMe_OR_EMPTY
      # Dissemination assurance (deployment write-back to OpenCTI)
      #- DEPLOYMENT_REPORTING_ENABLED=true # Optional (default: true)
      #- DEPLOYMENT_RECONCILIATION_INTERVAL=60 # Optional (default: 60 minutes, 0 disables the reconciliation)
      #- SECURITY_PLATFORM_NAME=SentinelOne # Optional (default: 'SentinelOne')
      #- SECURITY_PLATFORM_TYPE=EDR # Optional (default: 'EDR')
      #- SECURITY_PLATFORM_ID=ChangeMe # Optional (existing Security Platform entity id)
    restart: always