version: '3'
services:
  connector-threatfox:
    image: opencti/connector-threatfox:latest
    environment:
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe
      - CONNECTOR_NAME=ThreatFox
      - CONNECTOR_SCOPE=threatfox
      - CONNECTOR_LOG_LEVEL=error
      # Set at least one of the two modes. With both, the commercial one wins and
      # the Auth-Key is the fallback.
      - THREATFOX_AUTH_KEY=ChangeMe # Community mode, from https://auth.abuse.ch
      # - THREATFOX_SPAMHAUS_USERNAME=ChangeMe # Commercial mode, Spamhaus Customer Portal
      # - THREATFOX_SPAMHAUS_PASSWORD=ChangeMe
      - THREATFOX_INTERVAL=3 # In days
    restart: always
