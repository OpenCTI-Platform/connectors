version: '3'
services:
  connector-dogesec-vulmatch:
    image: opencti/connector-dogesec-vulmatch:latest
    environment:
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe
      #- CONNECTOR_NAME=Vulmatch
      #- CONNECTOR_SCOPE=vulmatch
      #- CONNECTOR_LOG_LEVEL=error
      #- CONNECTOR_DURATION_PERIOD=P1D # ISO-8601 interval between two runs
      #- VULMATCH_BASE_URL=https://api.vulmatch.com/
      - VULMATCH_API_KEY=ChangeMe
      #- VULMATCH_SBOM_ONLY=false
      #- VULMATCH_CVSS_V2_SCORE_MIN=-1 # -1 to not use filter
      #- VULMATCH_CVSS_V3_SCORE_MIN=-1 # -1 to not use filter
      #- VULMATCH_CVSS_V4_SCORE_MIN=-1 # -1 to not use filter
      #- VULMATCH_EPSS_SCORE_MIN=-1 # -1 to not use filter
      #- VULMATCH_DAYS_TO_BACKFILL=90 # max 365
    restart: always
