version: '3'
services:
  connector-stream-importer:
    image: opencti/connector-stream-importer:latest
    environment:
      # Connector's definition parameters:
      - CONNECTOR_NAME=StreamImporterConnector
      - CONNECTOR_SCOPE=stream-importer
      # Connector's generic execution parameters:
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_RUN_EVERY=1m
      # Connector's custom execution parameters:
      - PERFECT_SYNC=false
      - STREAM_IMPORTER_S3_ENDPOINT=minio
      - STREAM_IMPORTER_S3_PORT=9000
      - STREAM_IMPORTER_S3_SRC_PATH=opencti-export/opencti-stream
      - STREAM_IMPORTER_S3_SRC_RECURSE=false
      - STREAM_IMPORTER_S3_DST_PATH=opencti-export-done
      - STREAM_IMPORTER_S3_ACCESS_KEY=opencti
      - STREAM_IMPORTER_S3_SECRET_KEY=ChangeMe
      - STREAM_IMPORTER_S3_SECURE=false
      - STREAM_IMPORTER_S3_CERT_CHECK=false
    restart: always
