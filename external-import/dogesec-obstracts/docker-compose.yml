version: '3'
services:
  connector-dogesec-obstracts:
    image: opencti/connector-dogesec-obstracts:latest
    environment:
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe
      # - CONNECTOR_NAME=Obstracts
      # - CONNECTOR_SCOPE=obstracts
      # - CONNECTOR_LOG_LEVEL=error
      # - CONNECTOR_DURATION_PERIOD=PT1H
      - OBSTRACTS_API_KEY=ChangeMe
      # - OBSTRACTS_BASE_URL=https://api.obstracts.com/
      # - OBSTRACTS_FEED_IDS= # comma separated feed ids, empty for every subscribed feed
      # - OBSTRACTS_DAYS_TO_BACKFILL=7
    restart: always
