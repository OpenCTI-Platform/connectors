version: '3'
services:
  connector-urlhaus:
    image: opencti/connector-urlhaus:latest
    environment:
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe
      - CONNECTOR_NAME=Abuse.ch URLhaus
      - CONNECTOR_SCOPE=urlhaus
      - CONNECTOR_LOG_LEVEL=error
      - URLHAUS_INTERVAL=3
      # Authentication: set the community Auth-Key, the Spamhaus commercial credentials, or both
      - URLHAUS_AUTH_KEY=ChangeMe # Community mode, from https://auth.abuse.ch
      # - URLHAUS_SPAMHAUS_USERNAME=ChangeMe # Commercial mode, from the Spamhaus Customer Portal
      # - URLHAUS_SPAMHAUS_PASSWORD=ChangeMe
      # - URLHAUS_SPAMHAUS_IMPORT_FROM=P30D # Commercial mode, first run only
      - URLHAUS_DEFAULT_X_OPENCTI_SCORE=80 # Optional: Defaults to 80.
      - URLHAUS_IMPORT_OFFLINE=true
      - URLHAUS_THREATS_FROM_LABELS=true
    restart: always
