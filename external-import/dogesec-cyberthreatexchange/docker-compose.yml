version: '3'
services:
  connector-dogesec-cyberthreatexchange:
    image: opencti/connector-dogesec-cyberthreatexchange:latest
    environment:
      # Generic parameters (connection with OpenCTI)
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      # Common parameters for connectors of type EXTERNAL_IMPORT
      - CONNECTOR_ID=ChangeMe
      # - CONNECTOR_NAME=CyberThreatExchange
      # - CONNECTOR_SCOPE=cyberthreatexchange
      # - CONNECTOR_LOG_LEVEL=error
      # - CONNECTOR_DURATION_PERIOD=PT1H # ISO8601 format in String, start with 'P...' for Period
      # Parameters specific to connector-dogesec-cyberthreatexchange
      # - CYBERTHREATEXCHANGE_BASE_URL=https://api.cyberthreatexchange.com/
      - CYBERTHREATEXCHANGE_API_KEY=ChangeMe
      - CYBERTHREATEXCHANGE_FEED_IDS= # comma-separated feed IDs, at least one required
    restart: always
