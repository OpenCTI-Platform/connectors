[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CensysCollectionsConnector"
description = "External Import connector for Censys Collections."
dynamic = ["version"]
requires-python = ">=3.11"

dependencies = [
    "pycti==7.260811.0",
    "censys-platform~=0.14.0",
    "pydantic~=2.12.0",
    "pydantic-settings~=2.11.0",
    "connectors-sdk @ git+https://github.com/OpenCTI-Platform/connectors.git@master#subdirectory=connectors-sdk",
]

[project.scripts]
censys-collections-connector = "censys_collections.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-mock>=3.12",
    "factory-boy>=3.3",
]

[tool.pytest.ini_options]
testpaths = ["./tests"]
pythonpath = ["src"]
