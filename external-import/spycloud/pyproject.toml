[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spycloud"
description = "Filigran connector to import data from Spycloud into OpenCTI"
dynamic = ["version"]
readme = "README.md"
authors = [
  {name = "Filigran"},
  {name = "Pauline Eustachy", email = "pauline.eustachy@filigran.io"},
]
requires-python = ">= 3.11, <3.13"
dependencies = [
    "pycti==7.261002.0",
    "validators~=0.35.0",
    "pydantic>=2.8.2,<3",
    "connectors-sdk @ git+https://github.com/OpenCTI-Platform/connectors.git@master#subdirectory=connectors-sdk",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10",
]

all = [
    "spycloud[test]"
]

[tool.setuptools.packages.find]
where = ["."]
# `src` is a thin re-export package used only by the config schema generator,
# it must not be shipped as a top-level distribution package.
include = ["spycloud_connector*"]

[tool.setuptools.dynamic]
version = {attr = "spycloud_connector.__version__"}