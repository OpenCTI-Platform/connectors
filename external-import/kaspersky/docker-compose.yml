version: "3.8"
services:
  connector-kaspersky:
    image: opencti/connector-kaspersky:latest
    environment:
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe
      #- CONNECTOR_NAME=Kaspersky
      #- CONNECTOR_SCOPE=kaspersky
      #- CONNECTOR_LOG_LEVEL=error
      #- CONNECTOR_DURATION_PERIOD=PT12H
      - KASPERSKY_USER=ChangeMe
      - KASPERSKY_PASSWORD=ChangeMe
      #- KASPERSKY_BASE_URL=https://tip.kaspersky.com
      #- KASPERSKY_CERTIFICATE_PATH=/run/secrets/kaspersky_certificate  # No default: no client certificate is sent.
      #- KASPERSKY_TLP=Amber
      #- KASPERSKY_CREATE_OBSERVABLES=true
      #- KASPERSKY_CREATE_INDICATORS=true
      #- KASPERSKY_SCOPES=publication,master_ioc,master_yara
      #- KASPERSKY_PUBLICATION_START_TIMESTAMP=0
      #- KASPERSKY_PUBLICATION_REPORT_TYPE=threat-report
      #- KASPERSKY_PUBLICATION_REPORT_STATUS=New
      #- KASPERSKY_PUBLICATION_REPORT_IGNORE_PREFIXES=  # Empty by default, e.g. Monthly APT activity report
      #- KASPERSKY_PUBLICATION_EXCLUDED_IOC_INDICATOR_TYPES=  # Empty by default, e.g. Md5sum, FileItem/Sha1sum (OpenIOC search values)
      #- KASPERSKY_MASTER_IOC_FETCH_WEEKDAY=1  # ISO weekday (1 is Monday). Leave unset to fetch on every run.
      #- KASPERSKY_MASTER_IOC_EXCLUDED_IOC_INDICATOR_TYPES=  # Empty by default, e.g. md5Hash, sha1Hash (OpenIOC indicator types)
      #- KASPERSKY_MASTER_IOC_REPORT_TYPE=threat-report
      #- KASPERSKY_MASTER_IOC_REPORT_STATUS=New
      #- KASPERSKY_MASTER_YARA_FETCH_WEEKDAY=2  # ISO weekday (1 is Monday). Leave unset to fetch on every run.
      #- KASPERSKY_MASTER_YARA_INCLUDE_REPORT=true
      #- KASPERSKY_MASTER_YARA_REPORT_TYPE=threat-report
      #- KASPERSKY_MASTER_YARA_REPORT_STATUS=New
    restart: always
    secrets:
      - kaspersky_certificate

secrets:
  kaspersky_certificate:
    file: /path/to/certificate.pem  # Change to correct path.
