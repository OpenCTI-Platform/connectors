version: '3'

services:
  connector-withaname:
    image: opencti/connector-withaname:latest
    container_name: connector-withaname
    restart: always
    environment:
      # Generic parameters (connection with OpenCTI)
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      # Common parameters for connectors of type EXTERNAL_IMPORT
      - CONNECTOR_ID=ChangeMe
      # - CONNECTOR_NAME=DDoSIA
      # - CONNECTOR_SCOPE=withaname
      # - CONNECTOR_LOG_LEVEL=error
      # - CONNECTOR_DURATION_PERIOD=PT1H
      # Optional parameters for connector-withaname (commented out, set if needed)
      # - WITHANAME_API_BASE_URL=https://witha.name
      # - WITHANAME_TLP_LEVEL=green
      # - WITHANAME_IMPORT_START_TIMESTAMP=0 # 0 for all history (default: unset, latest snapshot only)
      # - WITHANAME_CREATE_NOTES=true # whether to create STIX Note objects with raw targets data
    networks:
      - opencti

networks:
  opencti:
    external: true
