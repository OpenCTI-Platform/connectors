version: '3'
services:
  connector-domaintools-iris-detect:
    image: opencti/connector-domaintools-iris-detect:latest
    environment:
      # Generic parameters (connection with OpenCTI)
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      # Common parameters for connectors of type EXTERNAL_IMPORT
      - CONNECTOR_ID=ChangeMe
      # - CONNECTOR_NAME=DomainToolsIrisDetectConnector # optional (default: 'DomainToolsIrisDetectConnector')
      # - CONNECTOR_SCOPE=stix2 # optional (default: 'stix2')
      # - CONNECTOR_LOG_LEVEL=error # optional (default: 'error')
      # - CONNECTOR_DURATION_PERIOD=PT1H # optional, interval in ISO-8601 format between two runs of the connector (default: 'PT1H')
      - DOMAINTOOLS_API_BASE_URL=https://api.domaintools.com/v1/iris-detect/
      - DOMAINTOOLS_API_KEY=ChangeMe
      # - DOMAINTOOLS_MONITOR_ID=ChangeMe # optional, only used when requesting domains for specific monitors (default: none)
      # - DOMAINTOOLS_STORE_IRIS_DATA=false # optional (default: false)
      # - DOMAINTOOLS_PREVIEW=false # optional (default: false)
      # - DOMAINTOOLS_TLP_LEVEL=clear # optional, available values: 'clear', 'white', 'green', 'amber', 'amber+strict', 'red' (default: 'clear')
    restart: always
