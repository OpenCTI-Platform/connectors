version: '3'
services:
  connector-dogesec-siemrules:
    image: opencti/connector-dogesec-siemrules:latest
    environment:
      # Generic parameters (connection with OpenCTI)
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      # Common parameters for connectors of type EXTERNAL_IMPORT
      - CONNECTOR_ID=ChangeMe
      # - CONNECTOR_NAME=SIEM Rules
      # - CONNECTOR_SCOPE=siemrules
      # - CONNECTOR_LOG_LEVEL=error
      # - CONNECTOR_DURATION_PERIOD=PT1H
      # Parameters for connector-dogesec-siemrules
      - SIEMRULES_API_KEY=ChangeMe
      - SIEMRULES_DETECTION_PACKS= # comma-separated Detection Pack IDs
      # - SIEMRULES_BASE_URL=https://api.siemrules.com/
    restart: always
