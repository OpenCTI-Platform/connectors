version: "3"
# Example: run one connector per IOC type (recommended for large day feeds).
# Prefer CONNECTOR_DURATION_PERIOD over legacy RST_THREAT_FEED_INTERVAL.
services:
  connector-rst-threat-feed-hourly:
    image: opencti/connector-rst-threat-feed:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=9288e3aa-3f94-4505-b31b-69585c470810
      - CONNECTOR_NAME=RST Threat Feed - Hourly
      - CONNECTOR_SCOPE=application/json
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_DURATION_PERIOD=PT1H
      - CONNECTOR_UPDATE_EXISTING_DATA=true
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT=true
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL=50
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - NO_PROXY=
      - RST_THREAT_FEED_BASEURL=https://api.rstcloud.net/v1
      - RST_THREAT_FEED_APIKEY=ChangeMe
      - RST_THREAT_FEED_PROXY=
      - RST_THREAT_FEED_SSL_VERIFY=true
      - RST_THREAT_FEED_CONTIMEOUT=30
      - RST_THREAT_FEED_READTIMEOUT=120
      - RST_THREAT_FEED_RETRY=2
      - RST_THREAT_FEED_MAX_RETRIES=3
      - RST_THREAT_FEED_RETRY_DELAY=10
      - RST_THREAT_FEED_RETRY_BACKOFF_MULTIPLIER=2.0
      - RST_THREAT_FEED_OPENCTI_BATCH_SIZE=200
      - RST_THREAT_FEED_IP=true
      - RST_THREAT_FEED_DOMAIN=true
      - RST_THREAT_FEED_URL=true
      - RST_THREAT_FEED_HASH=true
      - RST_THREAT_FEED_LATEST=1h
      - RST_THREAT_FEED_MIN_SCORE_IMPORT=40
      - RST_THREAT_FEED_MIN_SCORE_DETECTION_IP=45
      - RST_THREAT_FEED_MIN_SCORE_DETECTION_DOMAIN=45
      - RST_THREAT_FEED_MIN_SCORE_DETECTION_URL=45
      - RST_THREAT_FEED_MIN_SCORE_DETECTION_HASH=45
      - RST_THREAT_FEED_ONLY_NEW=true
      - RST_THREAT_FEED_ONLY_ATTRIBUTED=false
      - RST_THREAT_FEED_KEEP_NAMED_VULNS=true
      - RST_THREAT_FEED_CREATE_MITRE_TTPS=false
      - RST_THREAT_FEED_CREATE_CUSTOM_TTPS=true
    restart: always
    depends_on:
      - opencti

  connector-rst-threat-feed-ip:
