version: '3'
services:
  connector-infrastructure-tracker:
    image: opencti/connector-infrastructure-tracker:latest
    environment:
      # Generic parameters (connection with OpenCTI)
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      # Common parameters for connectors of type INTERNAL_HUNT
      - CONNECTOR_ID=ChangeMe
      # - CONNECTOR_NAME=Infrastructure Tracker # optional (default: 'Infrastructure Tracker')
      # - CONNECTOR_SCOPE=internet # optional, hunt platform slug (default: 'internet')
      # - CONNECTOR_LOG_LEVEL=error # optional (default: 'error')
      # - CONNECTOR_MAX_CONCURRENT_RUNS=2 # optional, connector-side limit of concurrent hunt runs (default: none)
      # - CONNECTOR_OBSERVABLE_TYPES=IPv4-Addr,Domain-Name # optional, IPv4-Addr and Domain-Name are the types created (default: IOC types)
      # - CONNECTOR_MAX_OBSERVABLES=100 # optional, observables created per hunt run (default: 100)
      # Internet search sources: configure at least one, an empty key disables its source
      - INFRASTRUCTURE_TRACKER_CENSYS_TOKEN=ChangeMe # Censys Platform personal access token
      # - INFRASTRUCTURE_TRACKER_CENSYS_ORGANISATION_ID= # optional, Censys organization ID (paid accounts)
      # - INFRASTRUCTURE_TRACKER_CENSYS_API_URL=https://api.platform.censys.io # optional
      # - INFRASTRUCTURE_TRACKER_SILENTPUSH_API_KEY= # optional, Silent Push API key
      # - INFRASTRUCTURE_TRACKER_SILENTPUSH_API_URL=https://api.silentpush.com # optional
      # - INFRASTRUCTURE_TRACKER_URLSCAN_API_KEY= # optional, urlscan.io API key
      # - INFRASTRUCTURE_TRACKER_URLSCAN_API_URL=https://urlscan.io # optional
      # - INFRASTRUCTURE_TRACKER_CYMRU_SCOUT_API_KEY= # optional, Team Cymru Scout API key
      # - INFRASTRUCTURE_TRACKER_CYMRU_SCOUT_API_URL=https://scout.cymru.com/api/scout # optional
      # Shodan InternetDB enrichment (no API key needed)
      # - INFRASTRUCTURE_TRACKER_INTERNETDB_ENABLED=true # optional (default: true)
      # - INFRASTRUCTURE_TRACKER_INTERNETDB_URL=https://internetdb.shodan.io # optional
      # - INFRASTRUCTURE_TRACKER_INTERNETDB_MAX_LOOKUPS=25 # optional, IP addresses enriched per hunt run (default: 25)
      # - INFRASTRUCTURE_TRACKER_CREATE_CERTIFICATES=true # optional, create the X.509 certificates found (default: true)
    restart: always
