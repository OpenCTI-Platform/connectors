version: '3'
services:
  connector-censys-hunt:
    image: opencti/connector-censys-hunt:latest
    environment:
      # Generic parameters (connection with OpenCTI)
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      # Common parameters for connectors of type INTERNAL_HUNT
      - CONNECTOR_ID=ChangeMe
      # - CONNECTOR_NAME=Censys Platform Hunt # optional (default: 'Censys Platform Hunt')
      # - CONNECTOR_SCOPE=censys # optional, hunt platform slug (default: 'censys')
      # - CONNECTOR_LOG_LEVEL=error # optional (default: 'error')
      # - CONNECTOR_MAX_CONCURRENT_RUNS=1 # optional, connector-side limit of concurrent hunt runs (default: 1)
      # - CONNECTOR_OBSERVABLE_TYPES=IPv4-Addr,IPv6-Addr,Domain-Name,Url,StixFile,Email-Addr # optional, IPv4-Addr and Domain-Name are created when listed (default: IOC types)
      # - CONNECTOR_MAX_OBSERVABLES=100 # optional, observables created per hunt run (default: 100)
      # Censys Platform
      - CENSYS_HUNT_TOKEN=ChangeMe # personal access token of a user with the API Access role
      # - CENSYS_HUNT_ORGANIZATION_ID= # organization whose credits the searches use (required by the paid plans)
      # - CENSYS_HUNT_API_URL=https://api.platform.censys.io # optional
      # - CENSYS_HUNT_CREATE_CERTIFICATES=true # optional, create the X.509 certificates found (default: true)
    restart: always
