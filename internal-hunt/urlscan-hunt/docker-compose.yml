version: '3'
services:
  connector-urlscan-hunt:
    image: opencti/connector-urlscan-hunt:latest
    environment:
      # Generic parameters (connection with OpenCTI)
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      # Common parameters for connectors of type INTERNAL_HUNT
      - CONNECTOR_ID=ChangeMe
      # - CONNECTOR_NAME=urlscan.io Hunt # optional (default: 'urlscan.io Hunt')
      # - CONNECTOR_SCOPE=urlscan # optional, hunt platform slug (default: 'urlscan')
      # - CONNECTOR_LOG_LEVEL=error # optional (default: 'error')
      # - CONNECTOR_MAX_CONCURRENT_RUNS=2 # optional, connector-side limit of concurrent hunt runs (default: 2)
      # - CONNECTOR_OBSERVABLE_TYPES=IPv4-Addr,IPv6-Addr,Domain-Name,Url,StixFile,Email-Addr # optional, IPv4-Addr and Domain-Name are created when listed (default: IOC types)
      # - CONNECTOR_MAX_OBSERVABLES=100 # optional, observables created per hunt run (default: 100)
      # urlscan.io
      - URLSCAN_HUNT_API_KEY=ChangeMe # API key with search access
      # - URLSCAN_HUNT_API_URL=https://urlscan.io # optional
    restart: always
