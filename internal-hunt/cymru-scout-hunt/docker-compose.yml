version: '3'
services:
  connector-cymru-scout-hunt:
    image: opencti/connector-cymru-scout-hunt:latest
    environment:
      # Generic parameters (connection with OpenCTI)
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      # Common parameters for connectors of type INTERNAL_HUNT
      - CONNECTOR_ID=ChangeMe
      # - CONNECTOR_NAME=Team Cymru Scout Hunt # optional (default: 'Team Cymru Scout Hunt')
      # - CONNECTOR_SCOPE=cymru-scout # optional, hunt platform slug (default: 'cymru-scout')
      # - CONNECTOR_LOG_LEVEL=error # optional (default: 'error')
      # - CONNECTOR_MAX_CONCURRENT_RUNS=1 # optional, connector-side limit of concurrent hunt runs (default: 1)
      # - CONNECTOR_OBSERVABLE_TYPES=IPv4-Addr,IPv6-Addr,Domain-Name,Url,StixFile,Email-Addr # optional, IPv4-Addr and Domain-Name are created when listed (default: IOC types)
      # - CONNECTOR_MAX_OBSERVABLES=100 # optional, observables created per hunt run (default: 100)
      # Team Cymru Scout
      - CYMRU_SCOUT_HUNT_API_KEY=ChangeMe # API key of an account with search queries
      # - CYMRU_SCOUT_HUNT_API_URL=https://scout.cymru.com/api/scout # optional
    restart: always
