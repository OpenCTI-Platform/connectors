version: '3'
services:
  connector-microsoft-sentinel-hunt:
    image: opencti/connector-microsoft-sentinel-hunt:latest
    environment:
      # Generic parameters (connection with OpenCTI)
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      # Common parameters for connectors of type INTERNAL_HUNT
      - CONNECTOR_ID=ChangeMe
      # - CONNECTOR_NAME=Microsoft Sentinel Hunt # optional (default: 'Microsoft Sentinel Hunt')
      # - CONNECTOR_SCOPE=microsoft-sentinel # optional, hunt platform slug (default: 'microsoft-sentinel')
      # - CONNECTOR_LOG_LEVEL=error # optional (default: 'error')
      # - CONNECTOR_SECURITY_PLATFORM_NAME=Microsoft Sentinel # optional, Security Platform the hunts run against (default: 'Microsoft Sentinel')
      # - CONNECTOR_SECURITY_PLATFORM_TYPE=SIEM # optional, 'SIEM', 'EDR', 'XDR', 'SOAR', 'NDR' or 'ISPM' (default: 'SIEM')
      # - CONNECTOR_MAX_CONCURRENT_RUNS=2 # optional, connector-side limit of concurrent hunt runs (default: none)
      # - CONNECTOR_OBSERVABLE_TYPES=IPv4-Addr,IPv6-Addr,Domain-Name,Url,StixFile,Email-Addr # optional (default: IOC types)
      # - CONNECTOR_MAX_OBSERVABLES=100 # optional, observables created per hunt run (default: 100)
      # Log Analytics workspace of Microsoft Sentinel
      - MICROSOFT_SENTINEL_HUNT_WORKSPACE_ID=ChangeMe # Log Analytics workspace ID (GUID)
      - MICROSOFT_SENTINEL_HUNT_TENANT_ID=ChangeMe # app registration tenant ID
      - MICROSOFT_SENTINEL_HUNT_CLIENT_ID=ChangeMe # app registration client ID
      - MICROSOFT_SENTINEL_HUNT_CLIENT_SECRET=ChangeMe # app registration client secret
      # - MICROSOFT_SENTINEL_HUNT_AUTH_TYPE=app_registration # optional, 'app_registration' or 'azure_credential' (default: 'app_registration')
      # - MICROSOFT_SENTINEL_HUNT_ADDITIONAL_WORKSPACES= # optional, other workspaces queried with the main one (default: none)
      # - MICROSOFT_SENTINEL_HUNT_API_URL=https://api.loganalytics.io # optional (default: Azure public cloud)
      # - MICROSOFT_SENTINEL_HUNT_AUTHORITY_HOST=login.microsoftonline.com # optional (default: Azure public cloud)
      # - MICROSOFT_SENTINEL_HUNT_SIGMA_PIPELINE=sentinel_asim # optional, 'sentinel_asim', 'azure_monitor', 'microsoft_xdr' or 'none'
    restart: always
